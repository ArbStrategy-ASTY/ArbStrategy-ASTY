<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09070f">
<title>ASTY Rebound</title>

<style>
:root{
  --bg:#09070f;
  --panel:#12101a;
  --panel2:#171321;
  --border:#302640;
  --text:#f5f0ff;
  --muted:#aaa0bb;
  --purple:#b590ff;
  --green:#69e7a6;
  --yellow:#ffd477;
  --red:#ff7f91;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:
    radial-gradient(
      circle at 50% -16%,
      rgba(139,90,255,.22),
      transparent 38%
    ),
    var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}

body{
  min-height:100vh;
}

.page{
  width:min(760px,100%);
  margin:0 auto;
  padding:
    calc(20px + env(safe-area-inset-top))
    18px
    calc(36px + env(safe-area-inset-bottom));
}

.brand{
  display:flex;
  align-items:center;
  gap:13px;
  margin-bottom:28px;
}

.brand-logo{
  width:48px;
  height:48px;
  object-fit:contain;
  filter:
    drop-shadow(
      0 0 16px rgba(170,120,255,.3)
    );
}

.brand-title{
  font-size:20px;
  font-weight:800;
}

.brand-project{
  margin-top:5px;
  color:var(--purple);
  font-size:11px;
  font-weight:700;
  letter-spacing:.12em;
  text-transform:uppercase;
}

.brand-subtitle{
  margin-top:4px;
  color:var(--muted);
  font-size:12px;
}

.hero{
  display:grid;
  grid-template-columns:
    minmax(0,1fr)
    145px;
  align-items:center;
  gap:18px;
  min-height:210px;
  padding:16px 4px 30px;
}

.wolf-wrap{
  display:flex;
  align-items:center;
  justify-content:center;
}

.wolf{
  width:100%;
  max-width:140px;
  max-height:180px;
  object-fit:contain;
  opacity:.28;
  filter:
    drop-shadow(
      0 0 32px rgba(156,103,255,.22)
    );
  pointer-events:none;
}

h1{
  margin:0 0 14px;
  font-size:
    clamp(42px,11vw,64px);
  line-height:.98;
  letter-spacing:-.04em;
  background:
    linear-gradient(
      90deg,
      #fff,
      #d7c6ff,
      var(--purple)
    );
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.lead{
  max-width:500px;
  margin:0;
  color:var(--muted);
  font-size:16px;
  line-height:1.6;
}

.card{
  padding:20px;
  border:1px solid var(--border);
  border-radius:24px;
  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.026),
      rgba(255,255,255,.012)
    ),
    var(--panel);
  box-shadow:
    0 22px 70px rgba(0,0,0,.28);
}

.status{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:18px;
  color:var(--muted);
  font-size:13px;
}

.dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#707070;
}

.dot.loading{
  background:var(--yellow);
  box-shadow:
    0 0 15px rgba(255,212,119,.68);
}

.dot.ready{
  background:var(--green);
  box-shadow:
    0 0 15px rgba(105,231,166,.72);
}

button{
  appearance:none;
  border:0;
  font-family:inherit;
  cursor:pointer;
}

button:disabled{
  opacity:.48;
  cursor:not-allowed;
}

.primary{
  width:100%;
  padding:16px 18px;
  border-radius:16px;
  color:#130921;
  background:
    linear-gradient(
      90deg,
      #c49dff,
      #8d63ff
    );
  box-shadow:
    0 9px 30px rgba(141,99,255,.25);
  font-size:16px;
  font-weight:800;
}

.deposit-button,
.secondary-button,
.test-swap-button{
  width:100%;
  margin-top:12px;
  padding:12px 14px;
  border-radius:13px;
  font-size:12px;
  font-weight:800;
}

.deposit-button,
.secondary-button{
  color:var(--purple);
  background:rgba(181,144,255,.08);
  border:
    1px solid rgba(181,144,255,.28);
}

.test-swap-button{
  color:#ffe4a5;
  background:rgba(255,212,119,.07);
  border:
    1px solid rgba(255,212,119,.3);
}

.danger-button{
  width:100%;
  margin-top:14px;
  padding:13px 14px;
  border-radius:13px;
  color:var(--red);
  background:rgba(255,127,145,.07);
  border:
    1px solid rgba(255,127,145,.28);
  font-size:13px;
  font-weight:800;
}

.logout{
  width:100%;
  margin-top:14px;
  padding:14px 18px;
  border:
    1px solid var(--border);
  border-radius:15px;
  color:var(--text);
  background:transparent;
  font-size:14px;
  font-weight:700;
}

.box{
  margin-top:14px;
  padding:17px;
  border:
    1px solid #292137;
  border-radius:17px;
  background:var(--panel2);
}

.balance-box{
  margin-top:0;
}

.section-label{
  margin-bottom:14px;
  color:var(--muted);
  font-size:11px;
  font-weight:700;
  letter-spacing:.09em;
  text-transform:uppercase;
}

.balance-grid{
  display:grid;
  grid-template-columns:
    repeat(2,minmax(0,1fr));
  gap:11px;
}

.balance-item{
  padding:15px;
  border:
    1px solid rgba(255,255,255,.055);
  border-radius:15px;
  background:rgba(255,255,255,.022);
}

.asset{
  margin-bottom:7px;
  color:var(--muted);
  font-size:12px;
  font-weight:650;
}

.amount{
  font-size:22px;
  font-weight:800;
  letter-spacing:-.03em;
}

.usd-value{
  min-height:18px;
  margin-top:4px;
  color:var(--muted);
  font-size:12px;
  font-weight:600;
}

.asset-info{
  margin-top:10px;
  color:var(--muted);
  font-size:11px;
  line-height:1.45;
}

.gas-state,
.pill{
  display:inline-block;
  margin-top:8px;
  padding:5px 8px;
  border-radius:8px;
  font-size:10px;
  font-weight:700;
}

.good{
  color:var(--green);
  background:rgba(105,231,166,.08);
}

.warn{
  color:var(--yellow);
  background:rgba(255,212,119,.08);
}

.bad{
  color:var(--red);
  background:rgba(255,127,145,.08);
}

.row-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:11px;
}

.row-title{
  font-size:14px;
  font-weight:800;
}

.state{
  padding:5px 9px;
  border-radius:9px;
  font-size:10px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.05em;
}

.state.enabled{
  color:var(--green);
  background:rgba(105,231,166,.09);
}

.state.disabled{
  color:var(--muted);
  background:rgba(255,255,255,.05);
}

.description{
  color:var(--muted);
  font-size:12px;
  line-height:1.55;
}

.note{
  margin-top:10px;
  color:#d8caf6;
  font-size:11px;
  line-height:1.5;
}

.status-box{
  margin-top:10px;
  padding:11px 12px;
  border-radius:11px;
  font-size:11px;
  line-height:1.5;
}

.success{
  color:#baf6d5;
  border:
    1px solid rgba(105,231,166,.22);
  background:rgba(105,231,166,.07);
}

.pending{
  color:#ffe4a5;
  border:
    1px solid rgba(255,212,119,.24);
  background:rgba(255,212,119,.07);
}

.failure{
  color:#ffc1ca;
  border:
    1px solid rgba(255,127,145,.24);
  background:rgba(255,127,145,.07);
}

.wallet-head{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:11px;
}

.wallet-mini-logo{
  width:21px;
  height:21px;
  object-fit:contain;
}

.wallet-title{
  color:var(--muted);
  font-size:11px;
  font-weight:700;
  letter-spacing:.09em;
  text-transform:uppercase;
}

.wallet-row{
  display:flex;
  align-items:center;
  gap:10px;
}

.wallet-address{
  flex:1;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-family:
    ui-monospace,
    SFMono-Regular,
    Men
