<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#09070f">

  <title>ASTY Rebound</title>

  <style>
    :root {
      --bg: #09070f;
      --panel: #12101a;
      --panel2: #171321;
      --border: #302640;
      --text: #f4efff;
      --muted: #a79db7;
      --purple: #b18cff;
      --purple2: #7a4dff;
      --green: #6ee7a8;
      --yellow: #ffd479;
      --red: #ff7b8b;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;

      background:
        radial-gradient(
          circle at 50% -20%,
          rgba(138,91,255,0.20),
          transparent 42%
        ),
        var(--bg);

      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    body {
      min-height: 100vh;
    }

    .wrap {
      width: min(720px, 100%);
      margin: 0 auto;

      padding:
        calc(22px + env(safe-area-inset-top))
        18px
        calc(34px + env(safe-area-inset-bottom));
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 30px;
    }

    .mark {
      width: 40px;
      height: 40px;
      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          var(--purple),
          var(--purple2)
        );

      box-shadow:
        0 0 28px rgba(177,140,255,0.30);
    }

    .brand strong {
      display: block;
      font-size: 18px;
    }

    .brand span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .hero {
      padding: 8px 2px 24px;
    }

    h1 {
      margin: 0 0 12px;

      font-size: clamp(34px, 9vw, 50px);
      line-height: 1;

      background:
        linear-gradient(
          90deg,
          #ffffff,
          var(--purple)
        );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .lead {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
    }

    .card {
      padding: 18px;

      border:
        1px solid var(--border);

      border-radius: 22px;

      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,0.025),
          rgba(255,255,255,0.012)
        ),
        var(--panel);

      box-shadow:
        0 18px 60px rgba(0,0,0,0.24);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 9px;

      margin-bottom: 18px;

      color: var(--muted);
      font-size: 13px;
    }

    .dot {
      width: 9px;
      height: 9px;

      border-radius: 50%;
      background: #666;
    }

    .dot.connecting {
      background: var(--yellow);

      box-shadow:
        0 0 14px rgba(255,212,121,0.65);
    }

    .dot.ready {
      background: var(--green);

      box-shadow:
        0 0 14px rgba(110,231,168,0.70);
    }

    button {
      width: 100%;
      appearance: none;
      border: 0;
      border-radius: 15px;

      padding: 15px 18px;

      font-size: 16px;
      font-weight: 750;

      cursor: pointer;
    }

    button:disabled {
      opacity: 0.48;
      cursor: not-allowed;
    }

    .primary {
      color: #120a22;

      background:
        linear-gradient(
          90deg,
          #c29dff,
          #9068ff
        );

      box-shadow:
        0 8px 28px rgba(144,104,255,0.24);
    }

    .secondary {
      margin-top: 10px;

      color: var(--text);
      background: transparent;

      border:
        1px solid var(--border);
    }

    .retry {
      margin-top: 10px;

      color: var(--text);
      background: rgba(177,140,255,0.12);

      border:
        1px solid rgba(177,140,255,0.28);
    }

    .grid {
      display: grid;
      gap: 10px;
      margin-top: 18px;
    }

    .row {
      padding: 13px 14px;

      border:
        1px solid #292136;

      border-radius: 15px;

      background:
        var(--panel2);
    }

    .label {
      margin-bottom: 6px;

      color: var(--muted);

      font-size: 11px;
      font-weight: 600;

      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .value {
      font-size: 14px;
      word-break: break-all;
    }

    .good {
      color: var(--green);
    }

    .waiting {
      color: var(--yellow);
    }

    .error {
      margin-top: 14px;

      padding: 12px 13px;

      border:
        1px solid rgba(255,123,139,0.25);

      border-radius: 13px;

      background:
        rgba(255,123,139,0.08);

      color: #ffc2c9;

      font-size: 13px;
      line-height: 1.45;
    }

    .info {
      margin-top: 14px;

      padding: 12px 13px;

      border:
        1px solid rgba(177,140,255,0.20);

      border-radius: 13px;

      background:
        rgba(177,140,255,0.07);

      color: #d8c9f7;

      font-size: 12px;
      line-height: 1.5;
    }

    .small {
      margin: 17px 2px 0;

      color: var(--muted);

      font-size: 12px;
      line-height: 1.5;
    }
  </style>


  <script type="importmap">
  {
    "imports": {
      "react":
        "https://esm.sh/react@18.3.1",

      "react/jsx-runtime":
        "https://esm.sh/react@18.3.1/jsx-runtime",

      "react-dom":
        "https://esm.sh/react-dom@18.3.1",

      "react-dom/client":
        "https://esm.sh/react-dom@18.3.1/client"
    }
  }
  </script>
</head>


<body>

<div id="root"></div>


<script type="module">

import React, {
  useEffect,
  useMemo,
  useRef,
  useState
} from "react";


import {
  createRoot
} from "react-dom/client";


import {
  PrivyProvider,
  usePrivy,
  useLoginWithSiws
} from "https://esm.sh/@privy-io/react-auth@3.43.0?external=react,react-dom";


import {
  useWallets,
  useCreateWallet,
  toSolanaWalletConnectors
} from "https://esm.sh/@privy-io/react-auth@3.43.0/solana?external=react,react-dom";



const APP_ID =
  "cmu6qkw8h029x0cjtidese1il";


const e =
  React.createElement;



/*
====================================================
HELPERS
====================================================
*/


function bytesToBase64(bytes) {

  let binary = "";

  const array =
    bytes instanceof Uint8Array
      ? bytes
      : new Uint8Array(bytes);


  for (
    let i = 0;
    i < array.length;
    i++
  ) {

    binary +=
      String.fromCharCode(
        array[i]
      );

  }


  return btoa(binary);
}



function getPhantomProvider() {

  if (
    window.phantom?.solana?.isPhantom
  ) {

    return window.phantom.solana;
  }


  if (
    window.solana?.isPhantom
  ) {

    return window.solana;
  }


  return null;
}



function isPrivySolanaWallet(wallet) {

  if (!wallet) {
    return false;
  }


  const client =
    String(
      wallet.walletClientType ||
      ""
    ).toLowerCase();


  const connector =
    String(
      wallet.connectorType ||
      ""
    ).toLowerCase();


  const standardName =
    String(
      wallet.standardWallet?.name ||
      ""
    ).toLowerCase();


  return (
    client.includes("privy") ||
    connector.includes("embedded") ||
    standardName.includes("privy")
  );
}



function findPrivyWallet(wallets) {

  return (
    wallets.find(
      wallet =>
        isPrivySolanaWallet(wallet)
    )
    ||
    null
  );
}



/*
====================================================
APP
====================================================
*/


function App() {

  const {
    ready,
    authenticated,
    user,
    logout,
    getAccessToken
  } = usePrivy();


  const {
    ready: walletsReady,
    wallets
  } = useWallets();


  const {
    generateSiwsMessage,
    loginWithSiws
  } = useLoginWithSiws();


  /*
   * Explicit Solana embedded-wallet creation.
   */
  const {
    createWallet
  } = useCreateWallet();



  const [
    phantomAddress,
    setPhantomAddress
  ] = useState("");


  const [
    createdWalletAddress,
    setCreatedWalletAddress
  ] = useState("");


  const [
    busy,
    setBusy
  ] = useState(false);


  const [
    progress,
    setProgress
  ] = useState("");


  const [
    error,
    setError
  ] = useState("");


  const [
    walletError,
    setWalletError
  ] = useState("");


  const [
    creatingWallet,
    setCreatingWallet
  ] = useState(false);


  const [
    tokenReady,
    setTokenReady
  ] = useState(false);


  /*
   * Prevent the automatic wallet creator
   * from firing repeatedly.
   */
  const walletCreationAttempted =
    useRef(false);



  /*
  ==================================================
  REBOUND WALLET
  ==================================================
  */


  const reboundWallet =
    useMemo(
      () => {

        if (!authenticated) {
          return null;
        }


        return findPrivyWallet(
          wallets
        );

      },

      [
        wallets,
        authenticated
      ]
    );



  const reboundAddress =

    reboundWallet?.address

    ||

    createdWalletAddress

    ||

    "";



  /*
  ==================================================
  PHANTOM ADDRESS FROM PRIVY SESSION
  ==================================================
  */


  const linkedPhantom =
    useMemo(
      () => {

        if (
          !user?.linkedAccounts
        ) {

          return null;
        }


        return (

          user.linkedAccounts.find(
            account => {

              const client =
                String(
                  account?.walletClientType ||
                  ""
                ).toLowerCase();


              const chain =
                String(
                  account?.chainType ||
                  ""
                ).toLowerCase();


              return (

                account?.type ===
                  "wallet"

                &&

                (
                  client.includes(
                    "phantom"
                  )

                  ||

                  chain === "solana"

                )

              );

            }
          )

          ||

          null
        );

      },

      [user]
    );



  const displayedPhantomAddress =

    phantomAddress

    ||

    linkedPhantom?.address

    ||

    "";



  /*
  ==================================================
  CREATE REBOUND WALLET
  ==================================================
  */


  async function ensureReboundWallet() {

    if (
      !authenticated ||
      creatingWallet
    ) {

      return;
    }


    /*
     * Already exists.
     */
    if (
      reboundWallet ||
      createdWalletAddress
    ) {

      return;
    }


    setWalletError("");

    setCreatingWallet(true);


    try {

      /*
       * createAdditional is intentionally
       * NOT enabled.
       *
       * Privy should therefore return/use
       * the user's normal Solana embedded
       * wallet instead of intentionally
       * creating extra wallets.
       */

      const result =
        await createWallet();


      /*
       * Depending on SDK response shape,
       * support either:
       *
       * result.address
       * or
       * result.wallet.address
       */

      const created =
        result?.wallet ||
        result;


      if (
        created?.address
      ) {

        setCreatedWalletAddress(
          created.address
        );

      }


      setCreatingWallet(false);

    }

    catch (err) {

      console.error(
        "Rebound wallet creation error:",
        err
      );


      setCreatingWallet(false);


      setWalletError(
        err?.message ||
        String(err) ||
        "Could not create the Rebound wallet."
      );

    }

  }



  /*
   * Once the user is authenticated,
   * automatically ensure that exactly
   * one Rebound wallet exists.
   */
  useEffect(
    () => {

      if (
        !ready ||
        !walletsReady ||
        !authenticated
      ) {

        return;
      }


      /*
       * Existing wallet found:
       * nothing to create.
       */
      if (
        reboundWallet ||
        createdWalletAddress
      ) {

        walletCreationAttempted.current =
          true;

        return;
      }


      if (
        walletCreationAttempted.current
      ) {

        return;
      }


      walletCreationAttempted.current =
        true;


      ensureReboundWallet();

    },

    [
      ready,
      walletsReady,
      authenticated,
      reboundWallet,
      createdWalletAddress
    ]
  );



  /*
  ==================================================
  ACCESS TOKEN
  ==================================================
  */


  useEffect(
    () => {

      let cancelled =
        false;


      async function loadToken() {

        if (
          !ready ||
          !authenticated
        ) {

          if (!cancelled) {

            setTokenReady(false);

          }

          return;
        }


        try {

          const token =
            await getAccessToken();


          if (!cancelled) {

            setTokenReady(
              Boolean(token)
            );

          }

        }

        catch (err) {

          console.error(
            "Access token error:",
            err
          );


          if (!cancelled) {

            setTokenReady(false);

          }

        }

      }


      loadToken();


      return () => {

        cancelled = true;

      };

    },

    [
      ready,
      authenticated,
      getAccessToken
    ]
  );



  /*
  ==================================================
  CONNECT + AUTHENTICATE PHANTOM
  ==================================================
  */


  async function connectPhantom() {

    setError("");

    setWalletError("");

    setBusy(true);

    setProgress(
      "Connecting Phantom…"
    );


    try {

      const provider =
        getPhantomProvider();


      if (!provider) {

        throw new Error(
          "Phantom was not detected. Mobile browser support will be added in the next Rebound step."
        );

      }



      /*
       * 1. Connect Phantom
       */

      const connection =
        await provider.connect();



      const address =

        connection?.publicKey
          ?.toString()

        ||

        provider?.publicKey
          ?.toString();



      if (!address) {

        throw new Error(
          "Phantom connected, but no wallet address was returned."
        );

      }



      setPhantomAddress(
        address
      );



      /*
       * 2. Generate SIWS login message
       */

      setProgress(
        "Preparing secure login…"
      );


      const message =
        await generateSiwsMessage({
          address
        });



      /*
       * 3. Phantom signs login message
       */

      setProgress(
        "Confirm the login in Phantom…"
      );


      const encodedMessage =
        new TextEncoder()
          .encode(message);



      const signed =
        await provider.signMessage(

          encodedMessage,

          "utf8"

        );



      if (
        !signed?.signature
      ) {

        throw new Error(
          "Phantom did not return a login signature."
        );

      }



      const signature =
        bytesToBase64(
          signed.signature
        );



      /*
       * 4. Privy verifies wallet ownership
       */

      setProgress(
        "Signing in to ASTY Rebound…"
      );


      await loginWithSiws({
        message,
        signature
      });



      setProgress(
        "Authenticated ✓"
      );


      setBusy(false);

    }

    catch (err) {

      console.error(
        "Phantom login error:",
        err
      );


      setBusy(false);

      setProgress("");


      let message =

        err?.message

        ||

        String(err)

        ||

        "Phantom login failed.";



      if (
        String(message)
          .toLowerCase()
          .includes(
            "user rejected"
          )
      ) {

        message =
          "The Phantom request was cancelled.";

      }



      setError(
        message
      );

    }

  }



  /*
  ==================================================
  MANUAL WALLET RETRY
  ==================================================
  */


  async function retryWalletCreation() {

    walletCreationAttempted.current =
      false;


    setWalletError("");

    setCreatedWalletAddress("");


    await ensureReboundWallet();


    walletCreationAttempted.current =
      true;

  }



  /*
  ==================================================
  LOGOUT
  ==================================================
  */


  async function handleLogout() {

    setError("");

    setWalletError("");

    setBusy(true);


    try {

      await logout();


      setTokenReady(false);

      setPhantomAddress("");

      setCreatedWalletAddress("");

      setProgress("");

      walletCreationAttempted.current =
        false;


      setBusy(false);

    }

    catch (err) {

      console.error(
        err
      );


      setBusy(false);


      setError(
        "Logout failed."
      );

    }

  }



  /*
  ==================================================
  STATUS
  ==================================================
  */


  const loading =

    !ready

    ||

    !walletsReady;



  let statusText =
    "Not connected";


  let dotClass =
    "dot";



  if (loading) {

    statusText =
      "Initializing Rebound…";

  }

  else if (
    authenticated
  ) {

    statusText =
      "Authenticated";

    dotClass =
      "dot ready";

  }

  else if (busy) {

    statusText =
      progress ||
      "Connecting…";

    dotClass =
      "dot connecting";

  }



  /*
  ==================================================
  UI
  ==================================================
  */


  return e(

    "main",

    {
      className:
        "wrap"
    },



    /*
    BRAND
    */


    e(

      "div",

      {
        className:
          "brand"
      },


      e(

        "div",

        {
          className:
            "mark"
        }

      ),


      e(

        "div",

        null,


        e(

          "strong",

          null,

          "ASTY Rebound"

        ),


        e(

          "span",

          null,

          "Automated dip & rebound strategy"

        )

      )

    ),



    /*
    HERO
    */


    e(

      "section",

      {
        className:
          "hero"
      },


      e(

        "h1",

        null,

        "Rebound"

      ),


      e(

        "p",

        {
          className:
            "lead"
        },

        "Connect Phantom to access ASTY Rebound."

      )

    ),



    /*
    MAIN CARD
    */


    e(

      "section",

      {
        className:
          "card"
      },



      /*
      STATUS
      */


      e(

        "div",

        {
          className:
            "status"
        },


        e(

          "span",

          {
            className:
              dotClass
          }

        ),


        statusText

      ),



      /*
      LOGGED OUT
      */


      !authenticated

      ?

      e(

        React.Fragment,

        null,


        e(

          "button",

          {

            className:
              "primary",


            disabled:

              loading

              ||

              busy,


            onClick:
              connectPhantom

          },


          busy

            ?

            "Connecting…"

            :

            "Connect Phantom"

        ),



        busy

        ?

        e(

          "div",

          {
            className:
              "info"
          },

          progress

        )

        :

        null

      )



      :



      /*
      LOGGED IN
      */


      e(

        React.Fragment,

        null,


        e(

          "div",

          {
            className:
              "grid"
          },



          /*
          PHANTOM WALLET
          */


          e(

            "div",

            {
              className:
                "row"
            },


            e(

              "div",

              {
                className:
                  "label"
              },

              "Phantom Wallet"

            ),


            e(

              "div",

              {
                className:
                  "value"
              },

              displayedPhantomAddress

              ||

              "Connected"

            )

          ),



          /*
          REBOUND WALLET
          */


          e(

            "div",

            {
              className:
                "row"
            },


            e(

              "div",

              {
                className:
                  "label"
              },

              "Rebound Wallet"

            ),


            e(

              "div",

              {
                className:

                  reboundAddress

                  ?

                  "value good"

                  :

                  "value waiting"
              },


              reboundAddress

              ||

              (
                creatingWallet

                ?

                "Creating Rebound wallet…"

                :

                "Loading Rebound wallet…"
              )

            )

          ),



          /*
          PRIVY USER
          */


          e(

            "div",

            {
              className:
                "row"
            },


            e(

              "div",

              {
                className:
                  "label"
              },

              "Privy User"

            ),


            e(

              "div",

              {
                className:
                  "value"
              },

              user?.id

              ||

              "—"

            )

          ),



          /*
          LOGIN SESSION
          */


          e(

            "div",

            {
              className:
                "row"
            },


            e(

              "div",

              {
                className:
                  "label"
              },

              "Login Session"

            ),


            e(

              "div",

              {
                className:

                  tokenReady

                  ?

                  "value good"

                  :

                  "value waiting"
              },


              tokenReady

              ?

              "Ready ✓"

              :

              "Preparing…"

            )

          )

        ),



        /*
        WALLET ERROR
        */


        walletError

        ?

        e(

          React.Fragment,

          null,


          e(

            "div",

            {
              className:
                "error"
            },

            walletError

          ),


          e(

            "button",

            {
              className:
                "retry",

              disabled:
                creatingWallet,

              onClick:
                retryWalletCreation

            },

            creatingWallet
              ? "Creating…"
              : "Retry Rebound Wallet"

          )

        )

        :

        null,



        /*
        SUCCESS
        */


        reboundAddress

        &&

        tokenReady

        ?

        e(

          "div",

          {
            className:
              "info"
          },

          "ASTY Rebound login successful. Phantom and your Rebound wallet are ready."

        )

        :

        null,



        /*
        LOGOUT
        */


        e(

          "button",

          {

            className:
              "secondary",

            disabled:
              busy,

            onClick:
              handleLogout

          },

          "Log out"

        )

      ),



      /*
      GENERAL ERROR
      */


      error

      ?

      e(

        "div",

        {
          className:
            "error"
        },

        error

      )

      :

      null,



      /*
      FOOTER
      */


      e(

        "p",

        {
          className:
            "small"
        },

        "Prototype only. ASTY checks, deposits, withdrawals and trading are not active yet."

      )

    )

  );

}



/*
====================================================
PRIVY PROVIDER
====================================================
*/


const connectors =
  toSolanaWalletConnectors({
    shouldAutoConnect:
      false
  });



createRoot(

  document.getElementById(
    "root"
  )

).render(

  e(

    PrivyProvider,

    {

      appId:
        APP_ID,


      config: {

        loginMethods: [
          "wallet"
        ],


        appearance: {

          theme:
            "dark",
