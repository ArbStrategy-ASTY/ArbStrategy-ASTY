function bytesToBase64(bytes){let s="";const a=bytes instanceof Uint8Array?bytes:new Uint8Array(bytes);for(const b of a)s+=String.fromCharCode(b);return btoa(s)}
function signatureToBase58(sig){return typeof sig==="string"?sig:bs58.encode(sig instanceof Uint8Array?sig:new Uint8Array(sig))}
function walletLooksLikePhantom(w){if(!w)return false;const x=[w.walletClientType,w.connectorType,w.standardWallet?.name].map(v=>String(v||"").toLowerCase());return x.some(v=>v.includes("phantom"))}
function isEmbeddedWallet(w){if(!w)return false;const x=[w.walletClientType,w.connectorType,w.standardWallet?.name].map(v=>String(v||"").toLowerCase());return x.some(v=>v.includes("privy")||v.includes("embedded"))}
function formatUsdc(v){const n=Number(v);return Number.isFinite(n)?n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}):"—"}
function formatSol(v){const n=Number(v);return Number.isFinite(n)?n.toLocaleString("en-US",{minimumFractionDigits:4,maximumFractionDigits:6}):"—"}
function formatUsd(v){const n=Number(v);return v!=null&&Number.isFinite(n)?`≈ $${n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}`:"—"}
function bpsToPercent(v){const n=Number(v);return Number.isFinite(n)?(n/100).toFixed(n%100===0?0:2):"—"}
function percentToBps(v){const n=Number(String(v).replace(",","."));if(!Number.isFinite(n)||n<=0)throw new Error("Enter a valid percentage.");return Math.round(n*100)}
function strategyStatusClass(status){const s=String(status||"").toUpperCase();if(s==="WATCHING")return "watching";if(s==="PAUSED")return "paused";if(s==="STOPPED")return "stopped";if(s==="COMPLETED")return "completed";return "live"}
function presetLabel(preset){return ({frequent:"Frequent",balanced:"Balanced",deep_dip:"Deep Dip",custom:"Custom"})[preset]||String(preset||"Strategy")}
function strategyStatusLabel(status){return ({WATCHING:"Watching",BUY_TRIGGERED:"Buying",BOUGHT:"Position open",SELL_TRIGGERED:"Selling",PAUSED:"Paused",COMPLETED:"Completed",STOPPED:"Stopped"})[String(status||"").toUpperCase()]||String(status||"—").replaceAll("_"," ")}
function formatMarketPrice(v){const n=Number(v);if(!Number.isFinite(n)||n<=0)return "—";const digits=n>=1?2:4;return `$${n.toLocaleString("en-US",{minimumFractionDigits:digits,maximumFractionDigits:digits})}`}
function strategyDistanceToBuy(strategy){const current=Number(strategy?.currentPriceUsd);const trigger=Number(strategy?.buyTriggerPriceUsd);if(!Number.isFinite(current)||current<=0||!Number.isFinite(trigger)||trigger<=0)return null;if(current<=trigger)return 0;return ((current-trigger)/current)*100}
function strategyDipProgress(strategy){const current=Number(strategy?.currentPriceUsd);const hwm=Number(strategy?.hwmPriceUsd);const trigger=Number(strategy?.buyTriggerPriceUsd);if(!Number.isFinite(current)||!Number.isFinite(hwm)||!Number.isFinite(trigger)||hwm<=trigger)return 0;return Math.max(0,Math.min(100,((hwm-current)/(hwm-trigger))*100))}
function formatDistance(v){if(v==null||!Number.isFinite(v))return "—";if(v<=0)return "Trigger reached";return `${v.toLocaleString("en-US",{minimumFractionDigits:v<10?2:1,maximumFractionDigits:v<10?2:1})}% to buy`}
function strategyDistanceToTarget(strategy){const current=Number(strategy?.currentPriceUsd);const target=Number(strategy?.takeProfitPriceMicroUsdc?Number(strategy.takeProfitPriceMicroUsdc)/1e6:strategy?.takeProfitPriceUsd);if(!Number.isFinite(current)||current<=0||!Number.isFinite(target)||target<=0)return null;if(current>=target)return 0;return ((target-current)/current)*100}
function strategyPositionProgress(strategy){const current=Number(strategy?.currentPriceUsd);const entry=Number(strategy?.buyFillPriceMicroUsdc?Number(strategy.buyFillPriceMicroUsdc)/1e6:strategy?.buyFillPriceUsd);const target=Number(strategy?.takeProfitPriceMicroUsdc?Number(strategy.takeProfitPriceMicroUsdc)/1e6:strategy?.takeProfitPriceUsd);if(!Number.isFinite(current)||!Number.isFinite(entry)||!Number.isFinite(target)||target<=entry)return 0;return Math.max(0,Math.min(100,((current-entry)/(target-entry))*100))}
function formatTargetDistance(v){if(v==null||!Number.isFinite(v))return "—";if(v<=0)return "Target reached";return `${v.toLocaleString("en-US",{minimumFractionDigits:v<10?2:1,maximumFractionDigits:v<10?2:1})}% to target`}
function formatPnl(v){const n=Number(v);if(!Number.isFinite(n))return "—";const sign=n>0?"+":"";return `${sign}${n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})} USDC`}
function formatLastCheck(value){if(!value)return "";const raw=String(value);const d=new Date(raw.includes("T")?raw:`${raw.replace(" ","T")}Z`);if(Number.isNaN(d.getTime()))return "";return d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}
function formatCycleDate(value){if(!value)return "";const raw=String(value);const d=new Date(raw.includes("T")?raw:`${raw.replace(" ","T")}Z`);if(Number.isNaN(d.getTime()))return "";return d.toLocaleString([],{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})}
function cycleExitLabel(reason){return ({TAKE_PROFIT:"Take profit",STOP_LOSS:"Stop loss",MANUAL_STOP:"Manual close"})[String(reason||"").toUpperCase()]||"Completed"}
function parseUnitsExact(v,d){const t=String(v).trim();if(!/^\d+(\.\d+)?$/.test(t))throw new Error("Enter a valid amount.");const [w,f=""]=t.split(".");if(f.length>d)throw new Error(`Maximum ${d} decimal places.`);return BigInt(w)*(10n**BigInt(d))+BigInt(f.padEnd(d,"0")||"0")}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function isMobileDevice(){return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent||"")}
function hasInjectedPhantom(){return Boolean(window.phantom?.solana?.isPhantom||window.solana?.isPhantom)}
function isInjectedPhantomConnected(){const p=window.phantom?.solana||window.solana;return Boolean(p?.isPhantom&&p?.isConnected)}

function getPhantomBootStage(){try{return new URL(window.location.href).searchParams.get(PHANTOM_BOOT_PARAM)||""}catch{return ""}}
function clearPhantomHandoff(){try{const u=new URL(window.location.href);u.searchParams.delete(PHANTOM_HANDOFF_PARAM);u.searchParams.delete(PHANTOM_BOOT_PARAM);const next=u.pathname+(u.search||"")+(u.hash||"");window.history.replaceState({},"",next)}catch{}}
function openInPhantom(){const target=new URL(window.location.href);target.searchParams.set(PHANTOM_HANDOFF_PARAM,"1");target.searchParams.set(PHANTOM_BOOT_PARAM,"1");const url=encodeURIComponent(target.toString());const ref=encodeURIComponent(window.location.origin);window.location.href=`https://phantom.app/ul/browse/${url}?ref=${ref}`}
async function waitForInjectedPhantom(maxMs){const started=Date.now();while(Date.now()-started<maxMs){if(hasInjectedPhantom())return true;await sleep(120)}return hasInjectedPhantom()}
function showPhantomBootScreen(message){const root=document.getElementById("root");if(!root)return;root.innerHTML=`<main class="page"><div class="brand"><img class="brand-logo" src="assets/logo.png" alt="ASTY"><div><div class="brand-title">ASTY Rebound</div><div class="brand-project">ArbStrategy</div><div class="brand-subtitle">Automated dip & rebound strategy</div></div></div><section class="card"><div class="status"><span class="dot loading"></span>${message}</div><div class="info" style="margin-top:0">Preparing the Phantom connection…</div></section></main>`}

const DEV_MODE=(()=>{try{return new URL(window.location.href).searchParams.get("dev")==="1"}catch{return false}})();

function App(){

  const {ready:walletsReady,wallets}=useWallets();

  const {createWallet}=useCreateWallet();

  const [error,setError]=useState("");
  const [copied,setCopied]=useState(false);

  const [usdcUsdValue,setUsdcUsdValue]=useState(null);

  const [solTradingReady,setSolTradingReady]=useState(null);
  const [solTradingBalance,setSolTradingBalance]=useState(null);
  const [prepareSolBusy,setPrepareSolBusy]=useState(false);
  const [prepareSolResult,setPrepareSolResult]=useState(null);
  const [phantomBrowserHint,setPhantomBrowserHint]=useState(false);
  const [depositAsset,setDepositAsset]=useState(null);

  const [depositState,setDepositState]=useState(null);
  const [depositSignature,setDepositSignature]=useState("");
  const [depositMessage,setDepositMessage]=useState("");
  const [withdrawAsset,setWithdrawAsset]=useState(null);
  const [withdrawAmount,setWithdrawAmount]=useState("");
  const [withdrawBusy,setWithdrawBusy]=useState(false);
  const [withdrawState,setWithdrawState]=useState(null);
  const [withdrawSignature,setWithdrawSignature]=useState("");
  const [withdrawMessage,setWithdrawMessage]=useState("");
  const [automationBusy,setAutomationBusy]=useState(false);
  const [automationOverride,setAutomationOverride]=useState(null);
  const [serverTestBusy,setServerTestBusy]=useState(false);
  const [serverTestResult,setServerTestResult]=useState(null);
  const [testSwapModalOpen,setTestSwapModalOpen]=useState(false);
  const [testSwapBusy,setTestSwapBusy]=useState(false);
  const [testSwapResult,setTestSwapResult]=useState(null);
  const [testSwapSignature,setTestSwapSignature]=useState("");
  const [reservedUsdc,setReservedUsdc]=useState(null);
  const [freeUsdc,setFreeUsdc]=useState(null);
  const [strategies,setStrategies]=useState([]);
  const [cycles,setCycles]=useState([]);
  const [cycleHistoryExpandedByStrategy,setCycleHistoryExpandedByStrategy]=useState({});
  const [strategiesLoading,setStrategiesLoading]=useState(false);
  const [strategyModalOpen,setStrategyModalOpen]=useState(false);
  const [strategyCreateBusy,setStrategyCreateBusy]=useState(false);
  const [strategyCreateResult,setStrategyCreateResult]=useState(null);
  const [strategyCapital,setStrategyCapital]=useState("25");
  const [strategyPreset,setStrategyPreset]=useState("balanced");
  const [customDipPercent,setCustomDipPercent]=useState("5");
  const [customTakeProfitPercent,setCustomTakeProfitPercent]=useState("4");
  const [stopLossEnabled,setStopLossEnabled]=useState(false);
  const [stopLossPercent,setStopLossPercent]=useState("5");
  const [autoRepeat,setAutoRepeat]=useState(false);
  const [compound,setCompound]=useState(false);
  const [executionCheckBusyId,setExecutionCheckBusyId]=useState("");
  const [executionCheckResults,setExecutionCheckResults]=useState({});
  const [sellCheckBusy,setSellCheckBusy]=useState(false);
  const [sellCheckResult,setSellCheckResult]=useState(null);
  const [strategyActionBusyId,setStrategyActionBusyId]=useState("");
  const [strategyActionResults,setStrategyActionResults]=useState({});
  const [strategyStopTarget,setStrategyStopTarget]=useState(null);

  const creationAttempted=useRef(false);
  const syncAttempted=useRef("");
  const authAttemptedFor=useRef("");
  const handoffConnectAttempted=useRef(false);
  const [phantomHandoff,setPhantomHandoff]=useState(()=>hasPhantomHandoff());

  const {connectWallet}=useConnectWallet({
    onSuccess:({wallet})=>{if(wallet?.address)setPendingWalletAddress(wallet.address);clearPhantomHandoff();setPhantomHandoff(false);setPhantomBrowserHint(false);setConnecting(false)},
    onError:(err)=>{console.error("Connect error:",err);setConnecting(false);const m=String(err?.message||err||"");if(m.toLowerCase().includes("generic_connect_wallet_error")){setPhantomBrowserHint(true);setError("");return}if(m.toLowerCase().includes("cancel"))return;setError(m||"Could not connect Phantom.")}
  });

  async function handleConnect(){
    setError("");
    if(isMobileDevice()&&!hasInjectedPhantom()){setPhantomBrowserHint(true);return}
    setPhantomBrowserHint(false);setConnecting(true);
    try{await connectWallet({description:"Connect Phantom to ASTY Rebound",walletList:["phantom"],walletChainType:"solana-only"})}catch(err){console.error(err);setConnecting(false)}
  }

  const connectedPhantomWallet=useMemo(()=>{
    if(pendingWalletAddress){const exact=wallets.find(w=>w?.address===pendingWalletAddress);if(exact)return exact}
    return wallets.find(walletLooksLikePhantom)||null;
  },[wallets,pendingWalletAddress]);

  /*
   * Mobile browser -> Phantom handoff recovery.
   *
   * On mobile, Phantom connections run inside Phantom's in-app browser.
   * A deep link can open a fresh Phantom tab while an older Privy session is
   * still authenticated but the actual Phantom wallet provider is not connected
   * in that tab. That combination used to leave the UI stuck on "Preparing".
   *
   * For a handoff we restore the original working flow automatically:
   * 1. If a stale Privy session exists without a connected Phantom wallet, log
   *    out of that web session only.
   * 2. Ask Phantom to connect in the in-app browser.
   * 3. The existing SIWS effect below performs the normal confirmation/login.
   */
  useEffect(()=>{
    if(!phantomHandoff||!ready||!walletsReady||handoffConnectAttempted.current||!hasInjectedPhantom())return;

    const livePhantom=Boolean(connectedPhantomWallet?.address&&typeof connectedPhantomWallet?.signMessage==="function"&&isInjectedPhantomConnected());

    if(livePhantom){
      clearPhantomHandoff();
      setPhantomHandoff(false);
      return;
    }

    handoffConnectAttempted.current=true;
    let cancelled=false;

    (async()=>{
      setError("");
      setPhantomBrowserHint(false);
      setConnecting(true);

      try{
        if(authenticated){
          await logout();
          if(cancelled)return;
          authAttemptedFor.current="";
          syncAttempted.current="";
          creationAttempted.current=false;
          setCreatedWallet(null);
          setSyncState("waiting");
          await sleep(200);
        }

        await connectWallet({
          description:"Connect Phantom to ASTY Rebound",
          walletList:["phantom"],
          walletChainType:"solana-only"
        });
      }catch(err){
        console.error("Phantom handoff connect error:",err);
        if(!cancelled){
          setConnecting(false);
          const m=String(err?.message||err||"");
          if(!m.toLowerCase().includes("cancel")){
            setError("Tap Connect Phantom to continue in Phantom.");
          }
        }
      }
    })();

    return()=>{cancelled=true};
  },[phantomHandoff,ready,walletsReady,connectedPhantomWallet,authenticated,logout,connectWallet]);

  async function authenticateWallet(wallet){
    if(!wallet||authenticated||signingIn||typeof wallet.signMessage!=="function")return;
    setError("");setSigningIn(true);
    try{
      const message=await generateSiwsMessage({address:wallet.address});
      const signed=await wallet.signMessage({message:new TextEncoder().encode(message)});
      if(!signed?.signature)throw new Error("Phantom did not return a login signature.");
      await loginWithSiws({message,signature:bytesToBase64(signed.signature)});
      setSigningIn(false);
    }catch(err){console.error("SIWS login error:",err);setSigningIn(false);const m=String(err?.message||err||"");if(m.toLowerCase().includes("user rejected")){setError("The Phantom login request was cancelled.");return}setError(m||"Could not complete the Phantom login.")}
  }

  useEffect(()=>{
    if(authenticated||signingIn||!connectedPhantomWallet||typeof connectedPhantomWallet.signMessage!=="function")return;
    const key=connectedPhantomWallet.address;if(!key||authAttemptedFor.current===key)return;authAttemptedFor.current=key;authenticateWallet(connectedPhantomWallet);
  },[authenticated,signingIn,connectedPhantomWallet]);

  const linkedPhantom=useMemo(()=>user?.linkedAccounts?.find(a=>a?.type==="wallet"&&[a?.walletClientType,a?.connectorType].some(v=>String(v||"").toLowerCase().includes("phantom")))||null,[user]);
  const phantomAddress=linkedPhantom?.address||connectedPhantomWallet?.address||pendingWalletAddress||"";

  const linkedEmbedded=useMemo(()=>user?.linkedAccounts?.find(a=>{
    if(a?.type!=="wallet")return false;
    const chain=String(a?.chainType||"").toLowerCase();
    const marker=`${a?.walletClientType||""} ${a?.connectorType||""}`.toLowerCase();
    return chain==="solana"&&a?.address!==phantomAddress&&(marker.includes("privy")||marker.includes("embedded"));
  })||null,[user,phantomAddress]);

  const embeddedFromWallets=useMemo(()=>wallets.find(w=>w?.address!==phantomAddress&&isEmbeddedWallet(w))||null,[wallets,phantomAddress]);
  const reboundWallet=linkedEmbedded||embeddedFromWallets||createdWallet||null;
  const reboundAddress=reboundWallet?.address||"";
  const reboundWalletId=reboundWallet?.id||null;
  const reboundSigningWallet=useMemo(()=>wallets.find(w=>w?.address===reboundAddress)||createdWallet||embeddedFromWallets||null,[wallets,reboundAddress,createdWallet,embeddedFromWallets]);
  const reboundDelegatedByPrivy=useMemo(()=>Boolean(reboundAddress&&user?.linkedAccounts?.some(a=>a?.type==="wallet"&&a?.address===reboundAddress&&a?.delegated===true)),[user,reboundAddress]);
  const automatedTradingEnabled=automationOverride!==null?automationOverride:reboundDelegatedByPrivy;

  useEffect(()=>{
    if(!ready||!walletsReady||!authenticated)return;
    if(phantomHandoff&&(!connectedPhantomWallet||connecting))return;
    if(reboundAddress){creationAttempted.current=true;sessionStorage.removeItem("asty_rebound_wallet_reload");return}
    if(creationAttempted.current)return;
    const timer=setTimeout(async()=>{
      if(reboundAddress||creationAttempted.current)return;
      creationAttempted.current=true;
      try{
        const result=await createWallet();const wallet=result?.wallet||result;if(wallet?.address)setCreatedWallet(wallet);
      }catch(err){
        console.error("Embedded wallet:",err);const m=String(err?.message||err||"");
        if(m.toLowerCase().includes("already has an embedded wallet")){if(!sessionStorage.getItem("asty_rebound_wallet_reload")){sessionStorage.setItem("asty_rebound_wallet_reload","1");setTimeout(()=>location.reload(),450)}return}
        setError("Your Rebound Wallet could not be loaded.");
      }
    },2500);
    return()=>clearTimeout(timer);
  },[ready,walletsReady,authenticated,reboundAddress,createWallet,phantomHandoff,connectedPhantomWallet,connecting]);

  useEffect(()=>{
    if(!authenticated||!user?.id||!phantomAddress||!reboundAddress)return;
    const key=[user.id,phantomAddress,reboundAddress].join(":");if(syncAttempted.current===key)return;syncAttempted.current=key;let cancelled=false;
    (async()=>{
      setSyncState("syncing");
      try{
        const token=await getAccessToken();if(!token)throw new Error("No login session.");
        const response=await fetch(`${API_BASE}/account/sync`,{method:"POST",headers:{"Content-Type":"application/json","Authorization":`Bearer ${token}`},body:JSON.stringify({phantomAddress,reboundWalletAddress:reboundAddress,reboundWalletId})});
        const result=await response.json();if(!response.ok)throw new Error(result?.message||"Account setup failed.");if(!cancelled)setSyncState("ready");
      }catch(err){console.error("D1 sync:",err);if(!cancelled){setSyncState("error");setError(err?.message||"Your Rebound account could not be synchronized.")}}
    })();
    return()=>{cancelled=true};
  },[authenticated,user?.id,phantomAddress,reboundAddress,reboundWalletId,getAccessToken]);

  async function loadBalance(){
    if(!authenticated||syncState!=="ready")return;setBalanceLoading(true);
    try{
      const token=await getAccessToken();if(!token)throw new Error("No session.");
      const response=await fetch(`${API_BASE}/account/balance`,{headers:{"Authorization":`Bearer ${token}`}});const result=await response.json();if(!response.ok)throw new Error(result?.message||"Balance unavailable.");
      setUsdcBalance(result?.balances?.usdc?.ui??"0");setReservedUsdc(result?.balances?.usdc?.reservedUi??"0");setFreeUsdc(result?.balances?.usdc?.freeUi??result?.balances?.usdc?.ui??"0");setSolBalance(result?.balances?.sol?.ui??"0");setUsdcUsdValue(result?.balances?.usdc?.usdValue??null);setSolUsdValue(result?.balances?.sol?.usdValue??null);setSolTradingReady(Boolean(result?.balances?.tradingSol?.ready));setSolTradingBalance(result?.balances?.tradingSol?.ui??null);setBalanceAvailable(true);
    }catch(err){console.error("Balance:",err);setBalanceAvailable(false);setUsdcBalance(null);setReservedUsdc(null);setFreeUsdc(null);setSolBalance(null);setUsdcUsdValue(null);setSolUsdValue(null);setSolTradingReady(null);setSolTradingBalance(null)}finally{setBalanceLoading(false)}
  }

  useEffect(()=>{if(!authenticated||syncState!=="ready")return;loadBalance();const id=setInterval(loadBalance,60000);return()=>clearInterval(id)},[authenticated,syncState]);

  async function loadStrategies(silent=false){
    if(!authenticated||syncState!=="ready")return;

      const token=await getAccessToken();if(!token)throw new Error("No session.");

      setStrategies(Array.isArray(result?.strategies)?result.strategies:[]);
      setCycles(Array.isArray(result?.cycles)?result.cycles:[]);
      if(result?.capital){setReservedUsdc(result.capital.reservedUsdc??"0");setFreeUsdc(result.capital.freeUsdc??"0");}
    }catch(err){console.error("Strategies:",err);if(!silent)setError(err?.message||"Strategies could not be loaded.");}
    finally{if(!silent)setStrategiesLoading(false)}
  }

  useEffect(()=>{
    if(!authenticated||syncState!=="ready")return;
    loadStrategies();
    const id=setInterval(()=>loadStrategies(true),60000);
    return()=>clearInterval(id);
  },[authenticated,syncState]);

  function openStrategyModal(){
    setError("");setStrategyCreateResult(null);setStrategyCapital(Number(freeUsdc)>=25?"25":String(freeUsdc??"25"));setStrategyPreset("balanced");setCustomDipPercent("5");setCustomTakeProfitPercent("4");setStopLossEnabled(false);setStopLossPercent("5");setAutoRepeat(false);setCompound(false);setStrategyModalOpen(true);
  }
  function closeStrategyModal(){if(!strategyCreateBusy)setStrategyModalOpen(false)}
  function useMaxStrategyCapital(){if(freeUsdc!=null&&Number(freeUsdc)>0)setStrategyCapital(String(freeUsdc))}

  async function createStrategy(){
    if(strategyCreateBusy)return;
    setError("");setStrategyCreateResult(null);
    const capital=Number(String(strategyCapital).replace(",","."));
    if(!Number.isFinite(capital)||capital<25){setStrategyCreateResult({state:"error",message:"A strategy requires at least 25 USDC."});return}
    if(freeUsdc!=null&&capital>Number(freeUsdc)+1e-9){setStrategyCreateResult({state:"error",message:"The strategy amount is higher than your free USDC balance."});return}
    let payload={capitalUsdc:String(strategyCapital).replace(",","."),preset:strategyPreset,stopLossEnabled,autoRepeat,compound};
    try{
      if(strategyPreset==="custom"){
        payload.dipBps=percentToBps(customDipPercent);
        payload.takeProfitBps=percentToBps(customTakeProfitPercent);
      }
      if(stopLossEnabled)payload.stopLossBps=percentToBps(stopLossPercent);
    }catch(err){setStrategyCreateResult({state:"error",message:err.message});return}
    setStrategyCreateBusy(true);
    try{
      const token=await getAccessToken();if(!token)throw new Error("Your login session has expired.");
      const response=await fetch(`${API_BASE}/strategies`,{method:"POST",headers:{"Content-Type":"application/json","Authorization":`Bearer ${token}`},body:JSON.stringify(payload)});
      const result=await response.json();
      if(!response.ok){

  function executionCheckMessage(result){
    if(!result)return "Execution check failed.";
    if(result.ready)return "Ready for BUY executor ✓";
    if(result.code){
      const labels={
        CAPITAL_RECONCILIATION_FAILED:"Capital check failed",
        GAS_RESERVE_LOW:"Gas reserve is too low",
        WSOL_ACCOUNT_NOT_READY:"SOL trading account is not ready",
        AUTOMATION_NOT_CONFIGURED:"Automated Trading is not fully configured",
        AUTOMATION_NOT_ENABLED:"Automated Trading is not enabled",
        JUPITER_ROUTE_MISMATCH:"Jupiter route does not match the strategy"
      };
      if(labels[result.code])return `${labels[result.code]}. ${result.message||""}`.trim();
    }
    const c=result.checks||{};
    if(c.capital&&c.capital.ok===false)return "Capital check failed.";
    if(c.gas&&c.gas.ok===false)return `Gas check failed. Current: ${c.gas.currentSol||"—"} SOL.`;
    if(c.automatedTrading&&c.automatedTrading.ok===false)return "Automated Trading check failed.";
    if(c.tradingSol&&c.tradingSol.ok===false)return "SOL trading account check failed.";
    if(c.jupiterV2&&c.jupiterV2.ok===false)return "Jupiter V2 route build failed.";
    if(c.policyCompatibility&&c.policyCompatibility.ok===false){
      const unexpected=Array.isArray(c.policyCompatibility.unexpectedPrograms)?c.policyCompatibility.unexpectedPrograms:[];
      return unexpected.length
        ? `Jupiter route is not compatible with the current trading policy. Unexpected program: ${unexpected.join(", ")}`
        : "Jupiter route is not compatible with the current trading policy.";
    }
    if(c.routeSanity&&c.routeSanity.ok===false){
      const bps=Number(c.routeSanity.referenceShortfallBps);
      const max=Number(c.routeSanity.maxReferenceShortfallBps);
      return Number.isFinite(bps)&&Number.isFinite(max)
        ? `Route price safety check failed: ${bps} bps reference difference (maximum ${max} bps).`
        : "Route price safety check failed.";
    }
    return result.message||"Execution check failed.";
  }

async function startReboundApp(){
  const handoff=hasPhantomHandoff();
  const bootStage=getPhantomBootStage();

  /*
   * Stage 1 runs immediately after the external mobile browser opens
   * this URL inside Phantom. We deliberately do NOT mount Privy yet.
   * We wait briefly for Phantom's injected provider and then perform
   * exactly one full page restart. That gives the Privy wallet connector
   * the same clean startup state that the previously required manual
   * refresh provided.
   */
  if(handoff&&bootStage==="1"){
    showPhantomBootScreen("Opening Phantom connection…");
    await waitForInjectedPhantom(4500);
    const next=new URL(window.location.href);
    next.searchParams.set(PHANTOM_BOOT_PARAM,"2");
    window.location.replace(next.toString());
    return;
  }

  /*
   * After the one-time restart, give Phantom a short final window to
   * expose its provider before the Solana connectors are created.
   * There is no second automatic reload, so a loop is impossible.
   */
  if(handoff&&bootStage==="2"&&!hasInjectedPhantom()){
    showPhantomBootScreen("Finishing Phantom connection…");
    await waitForInjectedPhantom(2500);
  }

  const connectors=toSolanaWalletConnectors();

  createRoot(document.getElementById("root")).render(
    e(PrivyProvider,{
      appId:APP_ID,
      config:{
        loginMethods:["wallet"],
        appearance:{theme:"dark",walletChainType:"solana-only",walletList:["phantom"]},
        externalWallets:{solana:{connectors}},
        embeddedWallets:{solana:{createOnLogin:"all-users"}}
      }
    },e(App))
  );
}

startReboundApp();
