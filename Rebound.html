<script type="module">

import React, {
  useEffect,
  useMemo,
  useRef,
  useState
} from "react";


import {
  createRoot
} from "react-dom/client";


import {
  PrivyProvider,
  usePrivy,
  useConnectWallet,
  useLoginWithSiws
} from "https://esm.sh/@privy-io/react-auth@3.43.0?external=react,react-dom";


import {
  useWallets,
  useCreateWallet,
  toSolanaWalletConnectors
} from "https://esm.sh/@privy-io/react-auth@3.43.0/solana?external=react,react-dom";


const APP_ID =
  "cmu6qkw8h029x0cjtidese1il";


const API_BASE =
  "https://asty-rebound-api.mail-timothy.workers.dev";


const e =
  React.createElement;


/*
====================================================
HELPERS
====================================================
*/


function bytesToBase64(bytes) {

  let binary = "";

  const array =
    bytes instanceof Uint8Array
      ? bytes
      : new Uint8Array(bytes);


  for (
    let i = 0;
    i < array.length;
    i++
  ) {

    binary +=
      String.fromCharCode(
        array[i]
      );

  }


  return btoa(binary);
}



function walletLooksLikePhantom(
  wallet
) {

  if (!wallet) {
    return false;
  }


  const client =
    String(
      wallet.walletClientType || ""
    ).toLowerCase();


  const connector =
    String(
      wallet.connectorType || ""
    ).toLowerCase();


  const standardName =
    String(
      wallet.standardWallet?.name || ""
    ).toLowerCase();


  return (

    client.includes("phantom")

    ||

    connector.includes("phantom")

    ||

    standardName.includes("phantom")

  );
}



function isEmbeddedWallet(
  wallet
) {

  if (!wallet) {
    return false;
  }


  const client =
    String(
      wallet.walletClientType || ""
    ).toLowerCase();


  const connector =
    String(
      wallet.connectorType || ""
    ).toLowerCase();


  const standardName =
    String(
      wallet.standardWallet?.name || ""
    ).toLowerCase();


  return (

    client.includes("privy")

    ||

    connector.includes("embedded")

    ||

    standardName.includes("privy")

  );
}



function formatUsdc(
  value
) {

  const n =
    Number(value || 0);


  if (!Number.isFinite(n)) {
    return "0.00";
  }


  return n.toLocaleString(
    "en-US",
    {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    }
  );

}



function formatSol(
  value
) {

  const n =
    Number(value || 0);


  if (!Number.isFinite(n)) {
    return "0.0000";
  }


  return n.toLocaleString(
    "en-US",
    {
      minimumFractionDigits: 4,
      maximumFractionDigits: 6
    }
  );

}



/*
====================================================
APP
====================================================
*/


function App() {

  const {
    ready,
    authenticated,
    user,
    logout,
    getAccessToken
  } = usePrivy();


  /*
   * IMPORTANT:
   *
   * These are the actual Privy Solana
   * ConnectedStandardSolanaWallet objects.
   *
   * signMessage() must be called on one
   * of these, not blindly on the object
   * returned by useConnectWallet.
   */
  const {
    ready: walletsReady,
    wallets
  } = useWallets();


  const {
    generateSiwsMessage,
    loginWithSiws
  } = useLoginWithSiws();


  const {
    createWallet
  } = useCreateWallet();



  /*
  ==================================================
  STATE
  ==================================================
  */


  const [
    pendingWalletAddress,
    setPendingWalletAddress
  ] = useState("");


  const [
    createdWallet,
    setCreatedWallet
  ] = useState(null);


  const [
    connecting,
    setConnecting
  ] = useState(false);


  const [
    signingIn,
    setSigningIn
  ] = useState(false);


  const [
    creatingWallet,
    setCreatingWallet
  ] = useState(false);


  const [
    syncState,
    setSyncState
  ] = useState("waiting");


  const [
    error,
    setError
  ] = useState("");


  const [
    copied,
    setCopied
  ] = useState(false);


  const [
    balanceLoading,
    setBalanceLoading
  ] = useState(false);


  const [
    usdcBalance,
    setUsdcBalance
  ] = useState(null);


  const [
    solBalance,
    setSolBalance
  ] = useState(null);


  const creationAttempted =
    useRef(false);


  const syncAttempted =
    useRef("");


  const authAttemptedFor =
    useRef("");



  /*
  ==================================================
  CONNECT PHANTOM
  ==================================================
  */


  const {
    connectWallet
  } = useConnectWallet({

    onSuccess: ({
      wallet
    }) => {

      /*
       * Do NOT call wallet.signMessage here.
       *
       * On mobile Safari this can be only
       * the connector result and may not
       * expose signMessage().
       *
       * Store the address and wait until
       * the corresponding Solana wallet
       * appears in useWallets().
       */

      const address =
        wallet?.address || "";


      if (address) {

        setPendingWalletAddress(
          address
        );

      }


      setConnecting(false);

    },


    onError: (
      err
    ) => {

      console.error(
        "Connect error:",
        err
      );


      setConnecting(false);


      const message =
        String(
          err?.message ||
          err ||
          ""
        );


      if (
        message
          .toLowerCase()
          .includes("cancel")
      ) {

        return;
      }


      setError(
        message ||
        "Could not connect Phantom."
      );

    }

  });



  async function handleConnect() {

    setError("");

    setConnecting(true);


    try {

      await connectWallet({

        description:
          "Connect Phantom to ASTY Rebound",

        walletList: [
          "phantom"
        ],

        walletChainType:
          "solana-only"

      });

    }

    catch (
      err
    ) {

      console.error(
        err
      );


      setConnecting(false);

    }

  }



  /*
  ==================================================
  FIND ACTUAL CONNECTED SOLANA WALLET
  ==================================================
  */


  const connectedPhantomWallet =
    useMemo(
      () => {

        /*
         * First choice:
         * exact address returned by connect.
         */
        if (
          pendingWalletAddress
        ) {

          const exact =
            wallets.find(
              wallet =>
                wallet?.address ===
                pendingWalletAddress
            );


          if (exact) {
            return exact;
          }

        }


        /*
         * Fallback:
         * detected Phantom Solana wallet.
         */
        return (

          wallets.find(
            wallet =>
              walletLooksLikePhantom(
                wallet
              )
          )

          ||

          null

        );

      },

      [
        wallets,
        pendingWalletAddress
      ]
    );



  /*
  ==================================================
  SIWS LOGIN
  ==================================================
  */


  async function authenticateWallet(
    wallet
  ) {

    if (
      !wallet ||
      authenticated ||
      signingIn
    ) {

      return;
    }


    if (
      typeof wallet.signMessage
      !== "function"
    ) {

      return;
    }


    setError("");

    setSigningIn(true);


    try {

      const message =
        await generateSiwsMessage({

          address:
            wallet.address

        });


      const encodedMessage =
        new TextEncoder()
          .encode(message);


      /*
       * This follows Privy's Solana
       * ConnectedStandardSolanaWallet API.
       */

      const signed =
        await wallet.signMessage({

          message:
            encodedMessage

        });


      const signature =
        signed?.signature;


      if (!signature) {

        throw new Error(
          "Phantom did not return a login signature."
        );

      }


      await loginWithSiws({

        message,

        signature:
          bytesToBase64(
            signature
          )

      });


      setSigningIn(false);

    }

    catch (
      err
    ) {

      console.error(
        "SIWS login error:",
        err
      );


      setSigningIn(false);


      const message =
        String(
          err?.message ||
          err ||
          ""
        );


      if (
        message
          .toLowerCase()
          .includes(
            "user rejected"
          )
      ) {

        setError(
          "The Phantom login request was cancelled."
        );

        return;
      }


      setError(
        message ||
        "Could not complete the Phantom login."
      );

    }

  }



  /*
   * Automatically authenticate only after
   * Privy has exposed the actual Solana
   * wallet with signMessage().
   */
  useEffect(
    () => {

      if (
        authenticated ||
        signingIn ||
        !connectedPhantomWallet
      ) {

        return;
      }


      if (
        typeof connectedPhantomWallet
          .signMessage !== "function"
      ) {

        return;
      }


      const key =
        connectedPhantomWallet.address;


      if (
        !key ||
        authAttemptedFor.current ===
          key
      ) {

        return;
      }


      authAttemptedFor.current =
        key;


      authenticateWallet(
        connectedPhantomWallet
      );

    },

    [
      authenticated,
      signingIn,
      connectedPhantomWallet
    ]
  );



  /*
  ==================================================
  PHANTOM ACCOUNT AFTER LOGIN
  ==================================================
  */


  const linkedPhantom =
    useMemo(
      () => {

        if (
          !user?.linkedAccounts
        ) {

          return null;
        }


        return (

          user.linkedAccounts.find(
            account => {

              const client =
                String(
                  account
                    ?.walletClientType ||
                  ""
                ).toLowerCase();


              const connector =
                String(
                  account
                    ?.connectorType ||
                  ""
                ).toLowerCase();


              return (

                account?.type ===
                  "wallet"

                &&

                (
                  client.includes(
                    "phantom"
                  )

                  ||

                  connector.includes(
                    "phantom"
                  )
                )

              );

            }
          )

          ||

          null

        );

      },

      [user]
    );



  const phantomAddress =

    linkedPhantom?.address

    ||

    connectedPhantomWallet?.address

    ||

    pendingWalletAddress

    ||

    "";



  /*
  ==================================================
  EXISTING REBOUND WALLET
  ==================================================
  */


  const linkedEmbedded =
    useMemo(
      () => {

        if (
          !user?.linkedAccounts
        ) {

          return null;
        }


        return (

          user.linkedAccounts.find(
            account => {

              if (
                account?.type !==
                "wallet"
              ) {

                return false;
              }


              const chain =
                String(
                  account
                    ?.chainType ||
                  ""
                ).toLowerCase();


              const client =
                String(
                  account
                    ?.walletClientType ||
                  ""
                ).toLowerCase();


              const connector =
                String(
                  account
                    ?.connectorType ||
                  ""
                ).toLowerCase();


              return (

                chain === "solana"

                &&

                account?.address !==
                  phantomAddress

                &&

                (
                  client.includes(
                    "privy"
                  )

                  ||

                  connector.includes(
                    "embedded"
                  )
                )

              );

            }
          )

          ||

          null

        );

      },

      [
        user,
        phantomAddress
      ]
    );



  const embeddedFromWallets =
    useMemo(
      () => {

        return (

          wallets.find(
            wallet => {

              return (

                wallet?.address !==
                  phantomAddress

                &&

                isEmbeddedWallet(
                  wallet
                )

              );

            }
          )

          ||

          null

        );

      },

      [
        wallets,
        phantomAddress
      ]
    );



  const reboundWallet =

    linkedEmbedded

    ||

    embeddedFromWallets

    ||

    createdWallet

    ||

    null;



  const reboundAddress =
    reboundWallet?.address || "";


  const reboundWalletId =
    reboundWallet?.id || null;



  /*
  ==================================================
  ENSURE REBOUND WALLET EXISTS
  ==================================================
  */


  useEffect(
    () => {

      if (
        !ready ||
        !walletsReady ||
        !authenticated
      ) {

        return;
      }


      if (
        reboundAddress
      ) {

        creationAttempted.current =
          true;


        sessionStorage.removeItem(
          "asty_rebound_wallet_reload"
        );


        return;
      }


      if (
        creationAttempted.current
      ) {

        return;
      }


      /*
       * Existing embedded wallets can take
       * a moment to appear after SIWS.
       */
      const timer =
        setTimeout(
          async () => {

            if (
              reboundAddress ||
              creationAttempted.current
            ) {

              return;
            }


            creationAttempted.current =
              true;


            setCreatingWallet(true);


            try {

              const result =
                await createWallet();


              const wallet =
                result?.wallet ||
                result;


              if (
                wallet?.address
              ) {

                setCreatedWallet(
                  wallet
                );

              }


              setCreatingWallet(false);

            }

            catch (
              err
            ) {

              console.error(
                "Embedded wallet:",
                err
              );


              setCreatingWallet(false);


              const message =
                String(
                  err?.message ||
                  err ||
                  ""
                );


              /*
               * Existing wallet is not an error.
               * Reload once so Privy's user/wallet
               * state can repopulate.
               */
              if (
                message
                  .toLowerCase()
                  .includes(
                    "already has an embedded wallet"
                  )
              ) {

                const alreadyReloaded =
                  sessionStorage
                    .getItem(
                      "asty_rebound_wallet_reload"
                    );


                if (
                  !alreadyReloaded
                ) {

                  sessionStorage
                    .setItem(
                      "asty_rebound_wallet_reload",
                      "1"
                    );


                  setTimeout(
                    () => {

                      location.reload();

                    },
                    450
                  );

                }


                return;
              }


              setError(
                "Your Rebound Wallet could not be loaded."
              );

            }

          },

          2500
        );


      return () =>
        clearTimeout(timer);

    },

    [
      ready,
      walletsReady,
      authenticated,
      reboundAddress,
      createWallet
    ]
  );



  /*
  ==================================================
  D1 ACCOUNT SYNC
  ==================================================
  */


  useEffect(
    () => {

      if (
        !authenticated ||
        !user?.id ||
        !phantomAddress ||
        !reboundAddress
      ) {

        return;
      }


      const key =
        [
          user.id,
          phantomAddress,
          reboundAddress
        ].join(":");


      if (
        syncAttempted.current ===
        key
      ) {

        return;
      }


      syncAttempted.current =
        key;


      let cancelled =
        false;


      async function syncAccount() {

        setSyncState(
          "syncing"
        );


        try {

          const token =
            await getAccessToken();


          if (!token) {

            throw new Error(
              "No login session."
            );

          }


          const response =
            await fetch(
              `${API_BASE}/account/sync`,
              {

                method:
                  "POST",

                headers: {

                  "Content-Type":
                    "application/json",

                  "Authorization":
                    `Bearer ${token}`

                },

                body:
                  JSON.stringify({

                    phantomAddress,

                    reboundWalletAddress:
                      reboundAddress,

                    reboundWalletId:
                      reboundWalletId

                  })

              }
            );


          const result =
            await response.json();


          if (!response.ok) {

            throw new Error(
              result?.message ||
              "Account setup failed."
            );

          }


          if (!cancelled) {

            setSyncState(
              "ready"
            );

          }

        }

        catch (
          err
        ) {

          console.error(
            "D1 sync:",
            err
          );


          if (!cancelled) {

            setSyncState(
              "error"
            );


            setError(
              "Your Rebound account could not be synchronized."
            );

          }

        }

      }


      syncAccount();


      return () => {

        cancelled =
          true;

      };

    },

    [
      authenticated,
      user?.id,
      phantomAddress,
      reboundAddress,
      reboundWalletId,
      getAccessToken
    ]
  );



  /*
  ==================================================
  BALANCE
  ==================================================
  */


  useEffect(
    () => {

      if (
        !authenticated ||
        syncState !== "ready"
      ) {

        return;
      }


      let cancelled =
        false;


      async function loadBalance() {

        setBalanceLoading(
          true
        );


        try {

          const token =
            await getAccessToken();


          if (!token) {

            throw new Error(
              "No session."
            );

          }


          const response =
            await fetch(
              `${API_BASE}/account/balance`,
              {

                headers: {

                  "Authorization":
                    `Bearer ${token}`

                }

              }
            );


          const result =
            await response.json();


          if (!response.ok) {

            throw new Error(
              result?.message ||
              "Balance unavailable."
            );

          }


          if (!cancelled) {

            setUsdcBalance(

              result?.balances
                ?.usdc
                ?.ui

              ??

              "0"

            );


            setSolBalance(

              result?.balances
                ?.sol
                ?.ui

              ??

              "0"

            );


            setBalanceLoading(
              false
            );

          }

        }

        catch (
          err
        ) {

          console.error(
            "Balance:",
            err
          );


          if (!cancelled) {

            setBalanceLoading(
              false
            );


            setError(
              "Your Rebound Balance is temporarily unavailable."
            );

          }

        }

      }


      loadBalance();


      const interval =
        setInterval(
          loadBalance,
          60000
        );


      return () => {

        cancelled =
          true;


        clearInterval(
          interval
        );

      };

    },

    [
      authenticated,
      syncState,
      getAccessToken
    ]
  );



  /*
  ==================================================
  COPY
  ==================================================
  */


  async function copyWallet() {

    if (
      !reboundAddress
    ) {

      return;
    }


    try {

      await navigator.clipboard
        .writeText(
          reboundAddress
        );


      setCopied(true);


      setTimeout(
        () =>
          setCopied(false),
        1400
      );

    }

    catch {

      setCopied(false);

    }

  }



  /*
  ==================================================
  LOGOUT
  ==================================================
  */


  async function handleLogout() {

    setError("");

    setUsdcBalance(null);

    setSolBalance(null);

    setSyncState(
      "waiting"
    );


    syncAttempted.current =
      "";


    authAttemptedFor.current =
      "";


    creationAttempted.current =
      false;


    setPendingWalletAddress("");

    setCreatedWallet(null);


    await logout();

  }



  /*
  ==================================================
  STATUS
  ==================================================
  */


  const loading =
    !ready ||
    !walletsReady;


  const accountReady =

    authenticated

    &&

    Boolean(
      reboundAddress
    )

    &&

    syncState === "ready";



  let statusText =
    "Not connected";


  let dotClass =
    "dot";


  if (
    loading
  ) {

    statusText =
      "Loading Rebound…";

    dotClass =
      "dot loading";

  }


  else if (
    connecting
  ) {

    statusText =
      "Connecting Phantom…";

    dotClass =
      "dot loading";

  }


  else if (
    signingIn
  ) {

    statusText =
      "Confirm login in Phantom…";

    dotClass =
      "dot loading";

  }


  else if (
    authenticated &&
    !accountReady
  ) {

    statusText =
      "Preparing Rebound…";

    dotClass =
      "dot loading";

  }


  else if (
    accountReady
  ) {

    statusText =
      "Connected";

    dotClass =
      "dot ready";

  }



  /*
  ==================================================
  UI
  ==================================================
  */


  return e(

    "main",

    {
      className:
        "page"
    },


    /*
    HEADER
    */


    e(

      "div",

      {
        className:
          "brand"
      },


      e(

        "img",

        {
          className:
            "brand-logo",

          src:
            "assets/logo.png",

          alt:
            "ASTY",

          onError:
            event => {
              event.currentTarget.style.display =
                "none";
            }
        }

      ),


      e(

        "div",

        null,


        e(

          "div",

          {
            className:
              "brand-title"
          },

          "ASTY Rebound"

        ),


        e(

          "div",

          {
            className:
              "brand-subtitle"
          },

          "Automated dip & rebound strategy"

        )

      )

    ),



    /*
    HERO
    */


    e(

      "section",

      {
        className:
          "hero"
      },


      e(

        "img",

        {
          className:
            "wolf",

          src:
            "assets/wolf.png",

          alt:
            "",

          onError:
            event => {
              event.currentTarget.style.display =
                "none";
            }
        }

      ),


      e(

        "div",

        {
          className:
            "hero-content"
        },


        e(

          "h1",

          null,

          "Rebound"

        ),


        e(

          "p",

          {
            className:
              "lead"
          },

          "Connect Phantom and let ASTY Rebound watch the market for you."

        )

      )

    ),



    /*
    ACCOUNT CARD
    */


    e(

      "section",

      {
        className:
          "card"
      },


      e(

        "div",

        {
          className:
            "status"
        },


        e(

          "span",

          {
            className:
              dotClass
          }

        ),


        statusText

      ),



      /*
      LOGGED OUT
      */


      !authenticated

      ?

      e(

        "button",

        {

          className:
            "primary",

          disabled:
            loading ||
            connecting ||
            signingIn,

          onClick:
            handleConnect

        },

        connecting
          ? "Opening Phantom…"

        : signingIn
          ? "Confirm in Phantom…"

        : "Connect Phantom"

      )



      :



      /*
      LOGGED IN
      */


      e(

        React.Fragment,

        null,


        /*
        BALANCE
        */


        accountReady

        ?

        e(

          "div",

          {
            className:
              "balance-box"
          },


          e(

            "div",

            {
              className:
                "section-label"
            },

            "Rebound Balance"

          ),


          e(

            "div",

            {
              className:
                "balance-grid"
            },


            e(

              "div",

              {
                className:
                  "balance-item"
              },


              e(

                "div",

                {
                  className:
                    "asset"
                },

                "USDC"

              ),


              e(

                "div",

                {
                  className:
                    "amount"
                },

                balanceLoading &&
                usdcBalance === null

                ?

                e(

                  "span",

                  {
                    className:
                      "amount loading"
                  },

                  "—"

                )

                :

                formatUsdc(
                  usdcBalance
                )

              )

            ),



            e(

              "div",

              {
                className:
                  "balance-item"
              },


              e(

                "div",

                {
                  className:
                    "asset"
                },

                "SOL"

              ),


              e(

                "div",

                {
                  className:
                    "amount"
                },

                balanceLoading &&
                solBalance === null

                ?

                e(

                  "span",

                  {
                    className:
                      "amount loading"
                  },

                  "—"

                )

                :

                formatSol(
                  solBalance
                )

              )

            )

          )

        )

        :

        e(

          "div",

          {
            className:
              "info"
          },

          "Preparing your Rebound account…"

        ),



        /*
        WALLET
        */


        reboundAddress

        ?

        e(

          "div",

          {
            className:
              "wallet-box"
          },


          e(

            "div",

            {
              className:
                "wallet-head"
            },


            e(

              "img",

              {
                className:
                  "wallet-mini-logo",

                src:
                  "assets/logo.png",

                alt:
                  "",

                onError:
                  event => {
                    event.currentTarget.style.display =
                      "none";
                  }
              }

            ),


            e(

              "div",

              {
                className:
                  "wallet-title"
              },

              "Your Rebound Wallet"

            )

          ),


          e(

            "div",

            {
              className:
                "wallet-row"
            },


            e(

              "div",

              {
                className:
                  "wallet-address"
              },

              reboundAddress

            ),


            e(

              "button",

              {
                className:
                  "copy",

                onClick:
                  copyWallet
              },

              copied
                ? "Copied ✓"
                : "Copy"

            )

          )

        )

        :

        null,



        e(

          "button",

          {
            className:
              "logout",

            onClick:
              handleLogout
          },

          "Log out"

        )

      ),



      /*
      ERROR
      */


      error

      ?

      e(

        "div",

        {
          className:
            "error"
        },

        error

      )

      :

      null,



      e(

        "div",

        {
          className:
            "fineprint"
        },

        "Prototype only. Deposits and automated trading are not active yet."

      )

    )

  );

}



/*
====================================================
PRIVY
====================================================
*/


const connectors =
  toSolanaWalletConnectors();



createRoot(

  document.getElementById(
    "root"
  )

).render(

  e(

    PrivyProvider,

    {

      appId:
        APP_ID,


      config: {

        loginMethods: [
          "wallet"
        ],


        appearance: {

          theme:
            "dark",

          walletChainType:
            "solana-only",

          /*
           * Privy's modal will use Phantom's
           * own wallet branding/icon here.
           */
          walletList: [
            "phantom"
          ]

        },


        externalWallets: {

          solana: {
            connectors
          }

        },


        embeddedWallets: {

          solana: {

            createOnLogin:
              "all-users"

          }

        }

      }

    },


    e(App)

  )

);

</script>

</body>
</html>
