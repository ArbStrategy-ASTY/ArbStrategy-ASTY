name: ASTY 68-pool volume collector test
on:
  push:
    branches: [test/asty-volume-egress]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Collect GeckoTerminal and DEX Screener volume for all dashboard pools
        run: node scripts/asty-volume-snapshot.mjs
      - name: Upload diagnostic snapshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: asty-pool-volume-snapshot-test
          path: data/asty-pool-volume.json
