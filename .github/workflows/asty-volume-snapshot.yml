name: ASTY 24h pool volume snapshot
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/asty-volume-snapshot.mjs'
      - '.github/workflows/asty-volume-snapshot.yml'

permissions:
  contents: write

concurrency:
  group: asty-pool-volume-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout dashboard source
        uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: true

      - name: Collect all ASTY pool volumes
        working-directory: source
        run: node scripts/asty-volume-snapshot.mjs

      - name: Checkout isolated public data branch
        uses: actions/checkout@v4
        with:
          ref: asty-volume-data
          path: published
          persist-credentials: true

      - name: Publish validated snapshot without changing main branch
        shell: bash
        run: |
          cp source/data/asty-pool-volume.json published/asty-pool-volume.json
          cd published
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add asty-pool-volume.json
          if git diff --cached --quiet; then
            echo "ASTY snapshot unchanged"
            exit 0
          fi
          git commit -m 'data: update ASTY 24h pool volume'
          git push origin HEAD:asty-volume-data
