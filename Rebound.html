<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -16%,rgba(139,90,255,.22),transparent 38%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}body{min-height:100vh}.page{width:min(760px,100%);margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 18px calc(36px + env(safe-area-inset-bottom))}
.brand{display:flex;align-items:center;gap:13px;margin-bottom:28px}.brand-logo{width:48px;height:48px;object-fit:contain;filter:drop-shadow(0 0 16px rgba(170,120,255,.3))}.brand-title{font-size:20px;font-weight:800}.brand-project{margin-top:5px;color:var(--purple);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.brand-subtitle{margin-top:4px;color:var(--muted);font-size:12px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) 145px;align-items:center;gap:18px;min-height:210px;padding:16px 4px 30px}.wolf-wrap{display:flex;align-items:center;justify-content:center}.wolf{width:100%;max-width:140px;max-height:180px;object-fit:contain;opacity:.28;filter:drop-shadow(0 0 32px rgba(156,103,255,.22));pointer-events:none}h1{margin:0 0 14px;font-size:clamp(42px,11vw,64px);line-height:.98;letter-spacing:-.04em;background:linear-gradient(90deg,#fff,#d7c6ff,var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}.lead{max-width:500px;margin:0;color:var(--muted);font-size:16px;line-height:1.6}
.card{padding:20px;border:1px solid var(--border);border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.026),rgba(255,255,255,.012)),var(--panel);box-shadow:0 22px 70px rgba(0,0,0,.28)}.status{display:flex;align-items:center;gap:10px;margin-bottom:18px;color:var(--muted);font-size:13px}.dot{width:9px;height:9px;border-radius:50%;background:#707070}.dot.loading{background:var(--yellow);box-shadow:0 0 15px rgba(255,212,119,.68)}.dot.ready{background:var(--green);box-shadow:0 0 15px rgba(105,231,166,.72)}
button{appearance:none;border:0;font-family:inherit;cursor:pointer}button:disabled{opacity:.48;cursor:not-allowed}.primary{width:100%;padding:16px 18px;border-radius:16px;color:#130921;background:linear-gradient(90deg,#c49dff,#8d63ff);box-shadow:0 9px 30px rgba(141,99,255,.25);font-size:16px;font-weight:800}.deposit-button,.secondary-button,.test-swap-button{width:100%;margin-top:12px;padding:12px 14px;border-radius:13px;font-size:12px;font-weight:800}.deposit-button,.secondary-button{color:var(--purple);background:rgba(181,144,255,.08);border:1px solid rgba(181,144,255,.28)}.test-swap-button{color:#ffe4a5;background:rgba(255,212,119,.07);border:1px solid rgba(255,212,119,.3)}.danger-button{width:100%;margin-top:14px;padding:13px 14px;border-radius:13px;color:var(--red);background:rgba(255,127,145,.07);border:1px solid rgba(255,127,145,.28);font-size:13px;font-weight:800}.logout{width:100%;margin-top:14px;padding:14px 18px;border:1px solid var(--border);border-radius:15px;color:var(--text);background:transparent;font-size:14px;font-weight:700}
.box{margin-top:14px;padding:17px;border:1px solid #292137;border-radius:17px;background:var(--panel2)}.balance-box{margin-top:0}.section-label{margin-bottom:14px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}.balance-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.balance-item{padding:15px;border:1px solid rgba(255,255,255,.055);border-radius:15px;background:rgba(255,255,255,.022)}.asset{margin-bottom:7px;color:var(--muted);font-size:12px;font-weight:650}.amount{font-size:22px;font-weight:800;letter-spacing:-.03em}.usd-value{min-height:18px;margin-top:4px;color:var(--muted);font-size:12px;font-weight:600}.asset-info{margin-top:10px;color:var(--muted);font-size:11px;line-height:1.45}.gas-state,.pill{display:inline-block;margin-top:8px;padding:5px 8px;border-radius:8px;font-size:10px;font-weight:700}.good{color:var(--green);background:rgba(105,231,166,.08)}.warn{color:var(--yellow);background:rgba(255,212,119,.08)}.bad{color:var(--red);background:rgba(255,127,145,.08)}
.row-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:11px}.row-title{font-size:14px;font-weight:800}.state{padding:5px 9px;border-radius:9px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}.state.enabled{color:var(--green);background:rgba(105,231,166,.09)}.state.disabled{color:var(--muted);background:rgba(255,255,255,.05)}.description{color:var(--muted);font-size:12px;line-height:1.55}.note{margin-top:10px;color:#d8caf6;font-size:11px;line-height:1.5}.status-box{margin-top:10px;padding:11px 12px;border-radius:11px;font-size:11px;line-height:1.5}.success{color:#baf6d5;border:1px solid rgba(105,231,166,.22);background:rgba(105,231,166,.07)}.pending{color:#ffe4a5;border:1px solid rgba(255,212,119,.24);background:rgba(255,212,119,.07)}.failure{color:#ffc1ca;border:1px solid rgba(255,127,145,.24);background:rgba(255,127,145,.07)}
.wallet-head{display:flex;align-items:center;gap:8px;margin-bottom:11px}.wallet-mini-logo{width:21px;height:21px;object-fit:contain}.wallet-title{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}.wallet-row{display:flex;align-items:center;gap:10px}.wallet-address{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:13px}.copy{padding:8px 12px;border:1px solid rgba(181,144,255,.28);border-radius:10px;color:var(--purple);background:rgba(181,144,255,.1);font-size:12px;font-weight:700}.info,.error{margin-top:14px;padding:12px 13px;border-radius:13px;font-size:12px;line-height:1.5}.info{border:1px solid rgba(181,144,255,.18);background:rgba(181,144,255,.07);color:#d8caf6}.error{border:1px solid rgba(255,127,145,.28);background:rgba(255,127,145,.08);color:#ffc1ca;word-break:break-word}.fineprint{margin:17px 3px 0;color:var(--muted);font-size:11px;line-height:1.5}.tx-link{display:inline-block;margin-top:6px;color:var(--purple);text-decoration:none;font-weight:700}
.modal-backdrop{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;padding:18px;background:rgba(3,2,7,.78);backdrop-filter:blur(8px)}.modal{width:min(480px,100%);padding:20px;border:1px solid var(--border);border-radius:24px;background:#131019;box-shadow:0 24px 80px rgba(0,0,0,.55)}.modal-title{margin:0;font-size:22px;font-weight:800}.modal-description{margin:8px 0 18px;color:var(--muted);font-size:12px;line-height:1.5}.input-label{display:block;margin-bottom:8px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.amount-input-wrap{display:flex;align-items:center;gap:10px;padding:3px 13px;border:1px solid var(--border);border-radius:14px;background:rgba(255,255,255,.025)}.amount-input{flex:1;min-width:0;padding:13px 0;border:0;outline:0;color:var(--text);background:transparent;font:inherit;font-size:19px;font-weight:750}.input-asset{color:var(--purple);font-size:13px;font-weight:800}.modal-wallet{margin-top:13px;color:var(--muted);font-size:11px;line-height:1.5}.modal-wallet strong{color:var(--text)}.modal-buttons{display:grid;grid-template-columns:1fr 1.5fr;gap:10px;margin-top:18px}.modal-cancel,.modal-confirm{padding:14px;border-radius:13px;font-weight:800}.modal-cancel{border:1px solid var(--border);color:var(--text);background:transparent}.modal-confirm{color:#130921;background:linear-gradient(90deg,#c49dff,#8d63ff)}
@media(max-width:540px){.hero{grid-template-columns:minmax(0,1fr) 105px;gap:8px;min-height:200px}.wolf{max-width:105px;max-height:145px}.balance-grid{grid-template-columns:1fr}}@media(min-width:541px){.modal-backdrop{align-items:center}}@media(max-width:370px){.hero{grid-template-columns:1fr}.wolf-wrap{display:none}}

<body>
<div id="root"></div>
<script type="module">
import React,{useEffect,useMemo,useRef,useState} from "react";
import {createRoot} from "react-dom/client";
import {PrivyProvider,usePrivy,useConnectWallet,useLoginWithSiws,useSigners} from "https://esm.sh/@privy-io/react-auth@3.43.0?external=react,react-dom";
import {useWallets,useCreateWallet,useSignAndSendTransaction,toSolanaWalletConnectors} from "https://esm.sh/@privy-io/react-auth@3.43.0/solana?external=react,react-dom";
import {PublicKey,Transaction,SystemProgram} from "https://esm.sh/@solana/web3.js@1.98.4";
import {getAssociatedTokenAddress,createAssociatedTokenAccountIdempotentInstruction,createTransferCheckedInstruction,TOKEN_PROGRAM_ID,ASSOCIATED_TOKEN_PROGRAM_ID} from "https://esm.sh/@solana/spl-token@0.4.14?deps=@solana/web3.js@1.98.4";
import bs58 from "https://esm.sh/bs58@6.0.0";

const APP_ID="cmu6qkw8h029x0cjtidese1il";
const API_BASE="https://asty-rebound-api.mail-timothy.workers.dev";
const USDC_MINT="EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v";
const WSOL_MINT="So11111111111111111111111111111111111111112";
const e=React.createElement;

function bytesToBase64(bytes){let s="";const a=bytes instanceof Uint8Array?bytes:new Uint8Array(bytes);for(const b of a)s+=String.fromCharCode(b);return btoa(s)}
function signatureToBase58(sig){return typeof sig==="string"?sig:bs58.encode(sig instanceof Uint8Array?sig:new Uint8Array(sig))}
function walletLooksLikePhantom(w){if(!w)return false;const x=[w.walletClientType,w.connectorType,w.standardWallet?.name].map(v=>String(v||"").toLowerCase());return x.some(v=>v.includes("phantom"))}
function isEmbeddedWallet(w){if(!w)return false;const x=[w.walletClientType,w.connectorType,w.standardWallet?.name].map(v=>String(v||"").toLowerCase());return x.some(v=>v.includes("privy")||v.includes("embedded"))}
function formatUsdc(v){const n=Number(v);return Number.isFinite(n)?n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}):"—"}
function formatSol(v){const n=Number(v);return Number.isFinite(n)?n.toLocaleString("en-US",{minimumFractionDigits:4,maximumFractionDigits:6}):"—"}
function formatUsd(v){const n=Number(v);return v!=null&&Number.isFinite(n)?`≈ $${n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}`:"—"}
function parseUnitsExact(v,d){const t=String(v).trim();if(!/^\d+(\.\d+)?$/.test(t))throw new Error("Enter a valid amount.");const [w,f=""]=t.split(".");if(f.length>d)throw new Error(`Maximum ${d} decimal places.`);return BigInt(w)*(10n**BigInt(d))+BigInt(f.padEnd(d,"0")||"0")}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function isIosDevice(){return /iPhone|iPad|iPod/i.test(navigator.userAgent||"")}
function hasInjectedPhantom(){return Boolean(window.phantom?.solana?.isPhantom||window.solana?.isPhantom)}
function openInPhantom(){const url=encodeURIComponent(window.location.href);const ref=encodeURIComponent(window.location.origin);window.location.href=`https://phantom.app/ul/browse/${url}?ref=${ref}`}

function App(){
  const {ready,authenticated,user,logout,getAccessToken}=usePrivy();
  const {ready:walletsReady,wallets}=useWallets();
  const {generateSiwsMessage,loginWithSiws}=useLoginWithSiws();
  const {createWallet}=useCreateWallet();
  const {signAndSendTransaction}=useSignAndSendTransaction();
  const {addSigners,removeSigners}=useSigners();

  const [pendingWalletAddress,setPendingWalletAddress]=useState("");
  const [createdWallet,setCreatedWallet]=useState(null);
  const [connecting,setConnecting]=useState(false);
  const [signingIn,setSigningIn]=useState(false);
  const [syncState,setSyncState]=useState("waiting");
  const [error,setError]=useState("");
  const [copied,setCopied]=useState(false);
  const [balanceLoading,setBalanceLoading]=useState(false);
  const [balanceAvailable,setBalanceAvailable]=useState(false);
  const [usdcBalance,setUsdcBalance]=useState(null);
  const [solBalance,setSolBalance]=useState(null);
  const [usdcUsdValue,setUsdcUsdValue]=useState(null);
  const [solUsdValue,setSolUsdValue]=useState(null);
  const [solTradingReady,setSolTradingReady]=useState(null);
  const [solTradingBalance,setSolTradingBalance]=useState(null);
  const [prepareSolBusy,setPrepareSolBusy]=useState(false);
  const [prepareSolResult,setPrepareSolResult]=useState(null);
  const [phantomBrowserHint,setPhantomBrowserHint]=useState(false);
  const [depositAsset,setDepositAsset]=useState(null);
  const [depositAmount,setDepositAmount]=useState("");
  const [depositBusy,setDepositBusy]=useState(false);
  const [depositState,setDepositState]=useState(null);
  const [depositSignature,setDepositSignature]=useState("");
  const [depositMessage,setDepositMessage]=useState("");
  const [automationBusy,setAutomationBusy]=useState(false);
  const [automationOverride,setAutomationOverride]=useState(null);
  const [serverTestBusy,setServerTestBusy]=useState(false);
  const [serverTestResult,setServerTestResult]=useState(null);
  const [testSwapModalOpen,setTestSwapModalOpen]=useState(false);
  const [testSwapBusy,setTestSwapBusy]=useState(false);
  const [testSwapResult,setTestSwapResult]=useState(null);
  const [testSwapSignature,setTestSwapSignature]=useState("");

  const creationAttempted=useRef(false);
  const syncAttempted=useRef("");
  const authAttemptedFor=useRef("");

  const {connectWallet}=useConnectWallet({
    onSuccess:({wallet})=>{if(wallet?.address)setPendingWalletAddress(wallet.address);setPhantomBrowserHint(false);setConnecting(false)},
    onError:(err)=>{console.error("Connect error:",err);setConnecting(false);const m=String(err?.message||err||"");if(m.toLowerCase().includes("generic_connect_wallet_error")){setPhantomBrowserHint(true);setError("");return}if(m.toLowerCase().includes("cancel"))return;setError(m||"Could not connect Phantom.")}
  });

  async function handleConnect(){
    setError("");
    if(isIosDevice()&&!hasInjectedPhantom()){setPhantomBrowserHint(true);return}
    setPhantomBrowserHint(false);setConnecting(true);
    try{await connectWallet({description:"Connect Phantom to ASTY Rebound",walletList:["phantom"],walletChainType:"solana-only"})}catch(err){console.error(err);setConnecting(false)}
  }

  const connectedPhantomWallet=useMemo(()=>{
    if(pendingWalletAddress){const exact=wallets.find(w=>w?.address===pendingWalletAddress);if(exact)return exact}
    return wallets.find(walletLooksLikePhantom)||null;
  },[wallets,pendingWalletAddress]);

  async function authenticateWallet(wallet){
    if(!wallet||authenticated||signingIn||typeof wallet.signMessage!=="function")return;
    setError("");setSigningIn(true);
    try{
      const message=await generateSiwsMessage({address:wallet.address});
      const signed=await wallet.signMessage({message:new TextEncoder().encode(message)});
      if(!signed?.signature)throw new Error("Phantom did not return a login signature.");
      await loginWithSiws({message,signature:bytesToBase64(signed.signature)});
      setSigningIn(false);
    }catch(err){console.error("SIWS login error:",err);setSigningIn(false);const m=String(err?.message||err||"");if(m.toLowerCase().includes("user rejected")){setError("The Phantom login request was cancelled.");return}setError(m||"Could not complete the Phantom login.")}
  }

  useEffect(()=>{
    if(authenticated||signingIn||!connectedPhantomWallet||typeof connectedPhantomWallet.signMessage!=="function")return;
    const key=connectedPhantomWallet.address;if(!key||authAttemptedFor.current===key)return;authAttemptedFor.current=key;authenticateWallet(connectedPhantomWallet);
  },[authenticated,signingIn,connectedPhantomWallet]);

  const linkedPhantom=useMemo(()=>user?.linkedAccounts?.find(a=>a?.type==="wallet"&&[a?.walletClientType,a?.connectorType].some(v=>String(v||"").toLowerCase().includes("phantom")))||null,[user]);
  const phantomAddress=linkedPhantom?.address||connectedPhantomWallet?.address||pendingWalletAddress||"";

  const linkedEmbedded=useMemo(()=>user?.linkedAccounts?.find(a=>{
    if(a?.type!=="wallet")return false;
    const chain=String(a?.chainType||"").toLowerCase();
    const marker=`${a?.walletClientType||""} ${a?.connectorType||""}`.toLowerCase();
    return chain==="solana"&&a?.address!==phantomAddress&&(marker.includes("privy")||marker.includes("embedded"));
  })||null,[user,phantomAddress]);

  const embeddedFromWallets=useMemo(()=>wallets.find(w=>w?.address!==phantomAddress&&isEmbeddedWallet(w))||null,[wallets,phantomAddress]);
  const reboundWallet=linkedEmbedded||embeddedFromWallets||createdWallet||null;
  const reboundAddress=reboundWallet?.address||"";
  const reboundWalletId=reboundWallet?.id||null;
  const reboundDelegatedByPrivy=useMemo(()=>Boolean(reboundAddress&&user?.linkedAccounts?.some(a=>a?.type==="wallet"&&a?.address===reboundAddress&&a?.delegated===true)),[user,reboundAddress]);
  const automatedTradingEnabled=automationOverride!==null?automationOverride:reboundDelegatedByPrivy;

  useEffect(()=>{
    if(!ready||!walletsReady||!authenticated)return;
    if(reboundAddress){creationAttempted.current=true;sessionStorage.removeItem("asty_rebound_wallet_reload");return}
    if(creationAttempted.current)return;
    const timer=setTimeout(async()=>{
      if(reboundAddress||creationAttempted.current)return;
      creationAttempted.current=true;
      try{
        const result=await createWallet();const wallet=result?.wallet||result;if(wallet?.address)setCreatedWallet(wallet);
      }catch(err){
        console.error("Embedded wallet:",err);const m=String(err?.message||err||"");
        if(m.toLowerCase().includes("already has an embedded wallet")){if(!sessionStorage.getItem("asty_rebound_wallet_reload")){sessionStorage.setItem("asty_rebound_wallet_reload","1");setTimeout(()=>location.reload(),450)}return}
        setError("Your Rebound Wallet could not be loaded.");
      }
    },2500);
    return()=>clearTimeout(timer);
  },[ready,walletsReady,authenticated,reboundAddress,createWallet]);

  useEffect(()=>{
    if(!authenticated||!user?.id||!phantomAddress||!reboundAddress)return;
    const key=[user.id,phantomAddress,reboundAddress].join(":");if(syncAttempted.current===key)return;syncAttempted.current=key;let cancelled=false;
    (async()=>{
      setSyncState("syncing");
      try{
        const token=await getAccessToken();if(!token)throw new Error("No login session.");
        const response=await fetch(`${API_BASE}/account/sync`,{method:"POST",headers:{"Content-Type":"application/json","Authorization":`Bearer ${token}`},body:JSON.stringify({phantomAddress,reboundWalletAddress:reboundAddress,reboundWalletId})});
        const result=await response.json();if(!response.ok)throw new Error(result?.message||"Account setup failed.");if(!cancelled)setSyncState("ready");
      }catch(err){console.error("D1 sync:",err);if(!cancelled){setSyncState("error");setError(err?.message||"Your Rebound account could not be synchronized.")}}
    })();
    return()=>{cancelled=true};
  },[authenticated,user?.id,phantomAddress,reboundAddress,reboundWalletId,getAccessToken]);

  async function loadBalance(){
    if(!authenticated||syncState!=="ready")return;setBalanceLoading(true);
    try{
      const token=await getAccessToken();if(!token)throw new Error("No session.");
      const response=await fetch(`${API_BASE}/account/balance`,{headers:{"Authorization":`Bearer ${token}`}});const result=await response.json();if(!response.ok)throw new Error(result?.message||"Balance unavailable.");
      setUsdcBalance(result?.balances?.usdc?.ui??"0");setSolBalance(result?.balances?.sol?.ui??"0");setUsdcUsdValue(result?.balances?.usdc?.usdValue??null);setSolUsdValue(result?.balances?.sol?.usdValue??null);setSolTradingReady(Boolean(result?.balances?.tradingSol?.ready));setSolTradingBalance(result?.balances?.tradingSol?.ui??null);setBalanceAvailable(true);
    }catch(err){console.error("Balance:",err);setBalanceAvailable(false);setUsdcBalance(null);setSolBalance(null);setUsdcUsdValue(null);setSolUsdValue(null);setSolTradingReady(null);setSolTradingBalance(null)}finally{setBalanceLoading(false)}
  }

  useEffect(()=>{if(!authenticated||syncState!=="ready")return;loadBalance();const id=setInterval(loadBalance,60000);return()=>clearInterval(id)},[authenticated,syncState]);

  function openDeposit(asset){setError("");setDepositAsset(asset);setDepositAmount(asset==="SOL"?"0.02":"")}
  function closeDeposit(){if(!depositBusy){setDepositAsset(null);setDepositAmount("")}}

  function buildSolTransaction(context){const from=new PublicKey(context.from),to=new PublicKey(context.to);const tx=new Transaction();tx.feePayer=from;tx.recentBlockhash=context.blockhash;tx.add(SystemProgram.transfer({fromPubkey:from,toPubkey:to,lamports:parseUnitsExact(context.amount,9)}));return tx}
  async function buildUsdcTransaction(context){const from=new PublicKey(context.from),to=new PublicKey(context.to),mint=new PublicKey(USDC_MINT);const sourceAta=await getAssociatedTokenAddress(mint,from,false,TOKEN_PROGRAM_ID,ASSOCIATED_TOKEN_PROGRAM_ID);const destAta=await getAssociatedTokenAddress(mint,to,false,TOKEN_PROGRAM_ID,ASSOCIATED_TOKEN_PROGRAM_ID);const tx=new Transaction();tx.feePayer=from;tx.recentBlockhash=context.blockhash;tx.add(createAssociatedTokenAccountIdempotentInstruction(from,destAta,to,mint,TOKEN_PROGRAM_ID,ASSOCIATED_TOKEN_PROGRAM_ID));tx.add(createTransferCheckedInstruction(sourceAta,mint,destAta,from,parseUnitsExact(context.amount,6),6,[],TOKEN_PROGRAM_ID));return tx}

  async function waitForConfirmation(signature){
    for(let i=0;i<30;i++){await sleep(2000);try{const token=await getAccessToken();if(!token)continue;const response=await fetch(`${API_BASE}/transaction/status?signature=${encodeURIComponent(signature)}`,{headers:{"Authorization":`Bearer ${token}`}});if(!response.ok)continue;const result=await response.json();if(result?.transactionError)throw new Error("The Solana transaction failed.");if(result?.confirmed)return true}catch(err){if(err?.message==="The Solana transaction failed.")throw err}}
    return false;
  }

  async function sendDeposit(){
    if(!depositAsset||depositBusy)return;setError("");setDepositMessage("");setDepositState(null);const amount=String(depositAmount).trim();
    if(!amount||Number(amount)<=0){setError("Enter a valid deposit amount.");return}
    if(!connectedPhantomWallet?.address){setError("Phantom must be connected before making a deposit.");return}
    setDepositBusy(true);
    try{
      const token=await getAccessToken();if(!token)throw new Error("Your login session has expired.");

                  : "Rebound Wallet"
              )
            ),

            e(
              "div",
              {
                className:"modal-buttons"
              },

              e(
                "button",
                {
                  className:"modal-cancel",
                  disabled:depositBusy,
                  onClick:closeDeposit
                },
                "Cancel"
              ),

              e(
                "button",
                {
                  className:"modal-confirm",
                  disabled:depositBusy,
                  onClick:sendDeposit
                },

                depositBusy
                  ? "Open Phantom…"
                  : `Deposit ${depositAsset}`
              )
            )
          )
        )

      : null,

    testSwapModalOpen
      ? e(
          "div",
          {
            className:"modal-backdrop",

            onClick:ev=>{
              if(
                ev.target===
                ev.currentTarget
              ){
                closeTestSwap();
              }
            }
          },

          e(
            "div",
            {
              className:"modal"
            },

            e(
              "h2",
              {
                className:"modal-title"
              },
              "Execute Real Test Swap?"
            ),

            e(
              "p",
              {
                className:"modal-description"
              },
              "This is a real on-chain trade from your Rebound Wallet. The backend will swap exactly 0.10 USDC into SOL through Jupiter using the automated Privy signer. The received SOL stays in the dedicated trading account while native SOL remains your gas reserve."
            ),

            e(
              "div",
              {
                className:"status-box pending"
              },
              "Real funds will move. Maximum slippage is 0.5%. No Phantom confirmation will appear for the swap itself because this test verifies offline backend trading."
            ),

            e(
              "div",
              {
                className:"modal-wallet"
              },

              "From Rebound Wallet: ",

              e(
                "strong",
                null,

                reboundAddress
                  ? `${reboundAddress.slice(0,8)}…${reboundAddress.slice(-8)}`
                  : "Rebound Wallet"
              )
            ),

            e(
              "div",
              {
                className:"modal-buttons"
              },

              e(
                "button",
                {
                  className:"modal-cancel",
                  disabled:testSwapBusy,
                  onClick:closeTestSwap
                },
                "Cancel"
              ),

              e(
                "button",
                {
                  className:"modal-confirm",
                  disabled:testSwapBusy,
                  onClick:executeTestSwap
                },

                testSwapBusy
                  ? "Executing…"
                  : "Execute 0.10 USDC Swap"
              )
            )
          )
        )

      : null
  );
}

const connectors=toSolanaWalletConnectors();

createRoot(
  document.getElementById(
    "root"
  )
).render(
  e(
    PrivyProvider,
    {
      appId:
        APP_ID,

      config:{
        loginMethods:[
          "wallet"
        ],

        appearance:{
          theme:
            "dark",

          walletChainType:
            "solana-only",

          walletList:[
            "phantom"
          ]
        },

        externalWallets:{
          solana:{
            connectors
          }
        },

        embeddedWallets:{
          solana:{
            createOnLogin:
              "all-users"
          }
        }
      }
    },

    e(App)
  )
);
</script>
</body>
</html>
