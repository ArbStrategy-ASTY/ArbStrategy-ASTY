<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ASTY Team Content Lab</title>

<style>
:root{
  --bg:#070912;
  --bg2:#0b0e19;
  --panel:#0f1322;
  --panel2:#121729;
  --line:rgba(255,255,255,.09);
  --line2:rgba(153,107,255,.26);
  --text:#f5f7ff;
  --muted:#aeb6d5;
  --soft:#7f89ad;
  --purple:#9864ff;
  --purple2:#bd91ff;
  --cyan:#63dfff;
  --green:#62efae;
  --shadow:0 22px 70px rgba(0,0,0,.38);
  --radius:24px;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh;
  color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 12% 0%, rgba(127,74,255,.10), transparent 26%),
    radial-gradient(circle at 96% 8%, rgba(69,210,255,.07), transparent 24%),
    linear-gradient(180deg,#060810 0%,#090b14 48%,#060810 100%);
}

button{
  font:inherit;
}

.wrap{
  width:min(1450px,calc(100% - 30px));
  margin:0 auto;
  padding:22px 0 42px;
}

/* HEADER */
.header{
  min-height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  padding:2px 2px 18px;
  border-bottom:1px solid rgba(255,255,255,.06);
  margin-bottom:22px;
}

.brand{
  display:flex;
  align-items:center;
  gap:15px;
}

.site-logo{
  width:60px;
  height:60px;
  object-fit:contain;
  display:block;
}

.brand-text h1{
  margin:0;
  font-size:clamp(26px,4vw,39px);
  line-height:1;
  letter-spacing:-.035em;
  font-weight:900;
  background:linear-gradient(90deg,#ffffff 0%,#c9a8ff 48%,#74e4ff 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.brand-text .mini{
  margin-top:7px;
  color:var(--soft);
  font-size:12px;
  letter-spacing:.12em;
  text-transform:uppercase;
  font-weight:800;
}

.generate-main{
  appearance:none;
  border:1px solid rgba(156,99,255,.34);
  cursor:pointer;
  color:#fff;
  font-weight:900;
  letter-spacing:.04em;
  padding:14px 20px;
  border-radius:14px;
  background:
    linear-gradient(135deg,rgba(150,93,255,.94),rgba(104,85,255,.96) 48%,rgba(69,207,255,.92));
  box-shadow:
    0 12px 34px rgba(127,74,255,.22),
    inset 0 1px 0 rgba(255,255,255,.14);
  transition:.18s ease;
}

.generate-main:hover{
  transform:translateY(-1px);
  filter:saturate(1.08) brightness(1.03);
}

/* INTRO STRIP */
.top-strip{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  flex-wrap:wrap;
  margin-bottom:16px;
}

.strip-left{
  color:var(--muted);
  font-size:14px;
}

.strip-left strong{
  color:#fff;
}

.strip-right{
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--soft);
  font-size:12px;
  letter-spacing:.08em;
  text-transform:uppercase;
  font-weight:800;
}

.live-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--purple),var(--cyan));
  box-shadow:0 0 16px rgba(152,100,255,.75);
}

/* PAIRS */
.pairs{
  display:grid;
  gap:18px;
}

.pair{
  position:relative;
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(420px,.92fr);
  gap:18px;
  padding:18px;
  border-radius:28px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.026),rgba(255,255,255,.014)),
    rgba(10,12,22,.86);
  border:1px solid var(--line);
  box-shadow:var(--shadow);
  overflow:hidden;
}

.pair::before{
  content:"";
  position:absolute;
  left:-120px;
  top:-140px;
  width:280px;
  height:280px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(140,81,255,.10),transparent 70%);
  pointer-events:none;
}

.text-side,
.visual-side{
  min-width:0;
}

.text-panel{
  height:100%;
  min-height:530px;
  padding:22px;
  border-radius:22px;
  border:1px solid rgba(255,255,255,.075);
  background:
    linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,.012)),
    #0c101c;
  display:flex;
  flex-direction:column;
}

.panel-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.topic-badge{
  display:inline-flex;
  align-items:center;
  padding:8px 11px;
  border-radius:999px;
  border:1px solid rgba(152,100,255,.26);
  background:rgba(152,100,255,.08);
  color:#cab3ff;
  font-size:11px;
  font-weight:900;
  letter-spacing:.12em;
  text-transform:uppercase;
}

.char-count{
  color:var(--soft);
  font-size:12px;
  font-weight:700;
}

.post-text{
  flex:1;
  white-space:pre-wrap;
  font-family:inherit;
  margin:0;
  color:#f6f7ff;
  font-size:15px;
  line-height:1.7;
  overflow-wrap:anywhere;
}

.actions{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  padding-top:18px;
  margin-top:18px;
  border-top:1px solid rgba(255,255,255,.065);
}

.action-btn{
  appearance:none;
  border:1px solid rgba(255,255,255,.10);
  background:rgba(255,255,255,.035);
  color:#eef1ff;
  border-radius:12px;
  padding:10px 13px;
  cursor:pointer;
  font-size:12px;
  font-weight:900;
  letter-spacing:.04em;
  transition:.16s ease;
}

.action-btn:hover{
  border-color:rgba(152,100,255,.38);
  background:rgba(152,100,255,.07);
}

.action-btn.primary{
  border-color:rgba(152,100,255,.28);
  background:linear-gradient(135deg,rgba(152,100,255,.18),rgba(76,204,255,.08));
}

/* VISUAL */
.visual-box{
  border-radius:22px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.08);
  background:#070912;
  box-shadow:0 18px 45px rgba(0,0,0,.24);
}

canvas{
  display:block;
  width:100%;
  height:auto;
  aspect-ratio:1/1;
}

.visual-actions{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin-top:11px;
}

/* TOAST */
.toast{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:99;
  padding:12px 15px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.11);
  background:rgba(15,18,31,.94);
  box-shadow:0 18px 50px rgba(0,0,0,.38);
  color:#fff;
  font-size:13px;
  font-weight:800;
  opacity:0;
  transform:translateY(10px);
  pointer-events:none;
  transition:.18s ease;
}

.toast.show{
  opacity:1;
  transform:translateY(0);
}

@media(max-width:1050px){
  .pair{
    grid-template-columns:1fr;
  }

  .text-panel{
    min-height:auto;
  }

  .visual-side{
    max-width:680px;
    width:100%;
    margin:0 auto;

const THEME_KEYS = Object.keys(THEMES);

function randomItem(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function hashString(str){
  let h=2166136261;
  for(let i=0;i<str.length;i++){
    h^=str.charCodeAt(i);
    h=Math.imul(h,16777619);
  }
  return (h>>>0).toString(16);
}

function saveHistory(){
  generationHistory = generationHistory.slice(-MAX_HISTORY);
  localStorage.setItem(HISTORY_KEY,JSON.stringify(generationHistory));
}

  const theme=THEMES[themeKey];

  for(let attempt=0;attempt<60;attempt++){
    const hook=randomItem(theme.hooks);
    const body=randomItem(theme.bodies);
    const close=randomItem(theme.closes);

    const text =
`🟣 ${hook}

${body.join("\n\n")}

${close}

Understand the System: ${SYSTEM_URL}
Telegram: ${TELEGRAM_URL}

#ASTY #ArbStrategy #ArbiTrage`;

    const id=hashString(text);

    if(!generationHistory.includes(id)){
      generationHistory.push(id);
      saveHistory();
      return {themeKey,text,id};
    }
  }

  const text =
`🟣 ${randomItem(theme.hooks)}

${randomItem(theme.bodies).join("\n\n")}

${randomItem(theme.closes)}

Understand the System: ${SYSTEM_URL}
Telegram: ${TELEGRAM_URL}

#ASTY #ArbStrategy #ArbiTrage`;

  return {themeKey,text,id:hashString(text)};
}

    themeKey,
    tag:theme.visualTag,
    title:theme.visualTitles[idx],
    sub:theme.visualSubs[idx]
  };
}

function generatePair(themeKey){
  return {
    post:buildPost(themeKey),
    visual:buildVisual(themeKey)
  };
}

function generateThree(){
  const themes=shuffle(THEME_KEYS).slice(0,3);
  currentPairs=themes.map(generatePair);
  renderPairs();
}

function regenerateOne(index){
  const currentTheme=currentPairs[index].post.themeKey;

  // 70% same topic for a direct variation, 30% fresh topic.
  const themeKey=Math.random()<.70
    ? currentTheme
    : randomItem(THEME_KEYS.filter(k=>k!==currentTheme));

  currentPairs[index]=generatePair(themeKey);
  renderPairAt(index);
  showToast("New text + visual generated");
}

/* =========================
   ASSETS
   ========================= */

function loadImageCandidates(paths){
  return new Promise(resolve=>{
    let index=0;

    const tryNext=()=>{
      if(index>=paths.length){
        resolve(null);
        return;
      }

      const img=new Image();
      img.onload=()=>resolve(img);
      img.onerror=()=>{
        index++;
        tryNext();
      };
      img.src=paths[index];
    };

    tryNext();
  });
}

async function getAssets(){
  if(assetCache) return assetCache;

  const [logo,wolf]=await Promise.all([
    loadImageCandidates(["assets/logo.png"]),
    loadImageCandidates(["assets/Wolf.png","assets/wolf.png"])
  ]);

  assetCache={logo,wolf};
  return assetCache;
}

/* =========================
   RENDER DOM
   ========================= */

function escapeHtml(str){
  return str
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;");
}

function renderPairs(){
  const container=document.getElementById("pairs");
  container.innerHTML="";

  currentPairs.forEach((pair,index)=>{
    const row=createPairElement(pair,index);
    container.appendChild(row);
    drawPairVisual(pair,index);
  });
}

function renderPairAt(index){
  const old=document.querySelector(`.pair[data-index="${index}"]`);
  if(!old){
    renderPairs();
    return;
  }

  const row=createPairElement(currentPairs[index],index);
  old.replaceWith(row);
  drawPairVisual(currentPairs[index],index);
}

function createPairElement(pair,index){
  const row=document.createElement("section");
  row.className="pair";
  row.dataset.index=index;

  row.innerHTML=`
    <div class="text-side">
      <div class="text-panel">
        <div class="panel-head">
          <span class="topic-badge">${escapeHtml(THEMES[pair.post.themeKey].label)}</span>
          <span class="char-count">${pair.post.text.length} characters</span>
        </div>

        <pre class="post-text">${escapeHtml(pair.post.text)}</pre>

        <div class="actions">
          <button class="action-btn primary copy-text-btn">COPY TEXT</button>
          <button class="action-btn new-pair-btn">NEW TEXT + VISUAL</button>
        </div>
      </div>
    </div>

    <div class="visual-side">
      <div class="visual-box">
        <canvas id="canvas-${index}" width="1080" height="1080"></canvas>
      </div>

      <div class="visual-actions">
        <button class="action-btn primary copy-image-btn">COPY IMAGE</button>
        <button class="action-btn download-image-btn">DOWNLOAD PNG</button>
      </div>
    </div>
  `;

  return row;
}

/* =========================
   CANVAS DESIGN
   ========================= */

function roundedRect(ctx,x,y,w,h,r){
  const rr=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+rr,y);
  ctx.arcTo(x+w,y,x+w,y+h,rr);
  ctx.arcTo(x+w,y+h,x,y+h,rr);
  ctx.arcTo(x,y+h,x,y,rr);
  ctx.arcTo(x,y,x+w,y,rr);
  ctx.closePath();
}

function drawCoverImage(ctx,img,x,y,w,h,alpha=1){
  if(!img) return;

  const ir=img.width/img.height;
  const tr=w/h;
  let sx=0,sy=0,sw=img.width,sh=img.height;

  if(ir>tr){
    sw=img.height*tr;
    sx=(img.width-sw)/2;
  }else{
    sh=img.width/tr;
    sy=(img.height-sh)/2;
  }

  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.drawImage(img,sx,sy,sw,sh,x,y,w,h);
  ctx.restore();
}

function fitImageContain(ctx,img,x,y,w,h,alpha=1){
  if(!img) return;

  const scale=Math.min(w/img.width,h/img.height);
  const dw=img.width*scale;
  const dh=img.height*scale;
  const dx=x+(w-dw)/2;
  const dy=y+(h-dh)/2;

  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.drawImage(img,dx,dy,dw,dh);
  ctx.restore();
}

function makeLinear(ctx,x1,y1,x2,y2,stops){
  const g=ctx.createLinearGradient(x1,y1,x2,y2);
  stops.forEach(([p,c])=>g.addColorStop(p,c));
  return g;
}

function drawGrid(ctx,w,h){
  ctx.save();

  // soft vertical / horizontal dashboard grid
  ctx.strokeStyle="rgba(255,255,255,.032)";
  ctx.lineWidth=1;

  for(let x=80;x<w;x+=80){
    ctx.beginPath();
    ctx.moveTo(x,0);
    ctx.lineTo(x,h);
    ctx.stroke();
  }

  for(let y=80;y<h;y+=80){
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(w,y);
    ctx.stroke();
  }

  // stronger guide lines
  ctx.strokeStyle="rgba(142,98,255,.055)";
  for(let x=160;x<w;x+=320){
    ctx.beginPath();
    ctx.moveTo(x,0);
    ctx.lineTo(x,h);
    ctx.stroke();
  }

  ctx.restore();
}

function drawAccentLines(ctx,w,h){
  ctx.save();

  ctx.lineCap="round";

  let grad=makeLinear(ctx,90,160,760,650,[
    [0,"rgba(150,94,255,.00)"],
    [.25,"rgba(150,94,255,.17)"],
    [.75,"rgba(76,216,255,.10)"],
    [1,"rgba(76,216,255,.00)"]
  ]);

  ctx.strokeStyle=grad;
  ctx.lineWidth=3;

  ctx.beginPath();
  ctx.moveTo(70,330);
  ctx.bezierCurveTo(260,250,390,410,610,310);
  ctx.bezierCurveTo(760,245,850,290,1010,220);
  ctx.stroke();

  ctx.globalAlpha=.7;
  ctx.beginPath();
  ctx.moveTo(130,410);
  ctx.bezierCurveTo(320,340,470,480,710,360);
  ctx.bezierCurveTo(820,305,910,350,1040,300);
  ctx.stroke();

  // minimal nodes
  const nodes=[
    [195,365],[390,381],[606,312],[821,284],[936,257]
  ];

  nodes.forEach(([x,y],i)=>{
    ctx.fillStyle=i%2===0
      ?"rgba(167,116,255,.58)"
      :"rgba(91,221,255,.48)";
    ctx.beginPath();
    ctx.arc(x,y,4,0,Math.PI*2);
    ctx.fill();
  });

  ctx.restore();
}

function drawTopLogo(ctx,logo){
  if(logo){
    fitImageContain(ctx,logo,872,70,135,105,1);
  }else{
    ctx.save();
    ctx.textAlign="right";
    ctx.font="900 32px Inter, sans-serif";
    ctx.fillStyle="#ffffff";
    ctx.fillText("ASTY",1000,125);
    ctx.restore();
  }
}

function drawWolfArea(ctx,wolf){
  // bottom panel
  ctx.save();
  const panelGrad=makeLinear(ctx,64,742,1016,1030,[
    [0,"rgba(151,91,255,.085)"],
    [.50,"rgba(255,255,255,.025)"],
    [1,"rgba(83,218,255,.055)"]
  ]);

  ctx.fillStyle=panelGrad;
  roundedRect(ctx,64,742,952,274,30);
  ctx.fill();

  ctx.strokeStyle="rgba(255,255,255,.075)";
  ctx.lineWidth=1.5;
  roundedRect(ctx,64,742,952,274,30);
  ctx.stroke();

  // wolf sits in lower left, faded into the panel
  if(wolf){
    ctx.save();

    // clip wolf to lower panel
    roundedRect(ctx,64,742,952,274,30);
    ctx.clip();

    fitImageContain(ctx,wolf,72,746,340,300,.92);

    // fade over right side of wolf so text stays readable
    const fade=makeLinear(ctx,260,742,510,742,[
      [0,"rgba(10,12,22,0)"],
      [.45,"rgba(10,12,22,.50)"],
      [1,"rgba(10,12,22,.95)"]
    ]);
    ctx.fillStyle=fade;
    ctx.fillRect(245,742,320,274);

    ctx.restore();
  }else{
    ctx.save();
    ctx.globalAlpha=.16;
    ctx.fillStyle="#b595ff";
    ctx.font="900 122px Inter, sans-serif";
    ctx.fillText("ASTY",92,925);
    ctx.restore();
  }

  ctx.restore();
}

function wrapText(ctx,text,maxWidth){
  const words=text.split(/\s+/);
  const lines=[];
  let current="";

  for(const word of words){
    const test=current ? current+" "+word : word;
    if(ctx.measureText(test).width<=maxWidth){
      current=test;
    }else{
      if(current) lines.push(current);
      current=word;
    }
  }

  if(current) lines.push(current);
  return lines;
}

function drawBigTitle(ctx,lines){
  const startY=300;
  const lineHeight=82;

  ctx.save();
  ctx.textAlign="left";
  ctx.font="900 70px Inter, sans-serif";

  lines.forEach((line,i)=>{
    const g=makeLinear(ctx,80,startY,820,startY,[
      [0,"#ffffff"],
      [.52,"#c19aff"],
      [1,"#78e5ff"]
    ]);

    ctx.fillStyle=g;
    ctx.fillText(line,82,startY+(i*lineHeight));
  });

  ctx.restore();
}

function drawBottomText(ctx,visual){
  ctx.save();

  // Text deliberately larger for mobile readability
  ctx.textAlign="left";
  ctx.font="800 34px Inter, sans-serif";
  ctx.fillStyle="#f4f6ff";

  const maxWidth=545;
  const lines=wrapText(ctx,visual.sub,maxWidth);
  const lineHeight=45;
  const startX=430;
  const startY=820;

  lines.slice(0,4).forEach((line,i)=>{
    ctx.fillText(line,startX,startY+i*lineHeight);
  });

  // small fixed system signature, still large enough to read on mobile
  ctx.font="800 24px Inter, sans-serif";
  ctx.fillStyle="#9fa9cf";
  ctx.fillText("ArbStrategy.net",430,982);

  ctx.restore();
}

async function drawPairVisual(pair,index){
  const canvas=document.getElementById(`canvas-${index}`);
  if(!canvas) return;

  const ctx=canvas.getContext("2d");
  const w=canvas.width;
  const h=canvas.height;
  const assets=await getAssets();

  ctx.clearRect(0,0,w,h);

  // Base background
  const bg=makeLinear(ctx,0,0,w,h,[
    [0,"#090b14"],
    [.48,"#0d1120"],
    [1,"#070911"]
  ]);
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,w,h);

  drawGrid(ctx,w,h);
  drawAccentLines(ctx,w,h);

  // subtle top-right glow behind logo
  const glow=ctx.createRadialGradient(940,110,0,940,110,240);
  glow.addColorStop(0,"rgba(91,215,255,.12)");
  glow.addColorStop(.42,"rgba(150,94,255,.07)");
  glow.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=glow;
  ctx.fillRect(690,0,390,330);

  // Main frame
  ctx.fillStyle="rgba(255,255,255,.014)";
  roundedRect(ctx,44,44,992,992,38);
  ctx.fill();

  ctx.strokeStyle="rgba(255,255,255,.085)";
  ctx.lineWidth=2;
  roundedRect(ctx,44,44,992,992,38);
  ctx.stroke();

  // Tag
  ctx.fillStyle="rgba(151,96,255,.10)";
  roundedRect(ctx,82,79,320,54,999);
  ctx.fill();

  ctx.strokeStyle="rgba(151,96,255,.24)";
  ctx.lineWidth=1.5;
  roundedRect(ctx,82,79,320,54,999);
  ctx.stroke();

  ctx.fillStyle="#cab4ff";
  ctx.font="900 22px Inter, sans-serif";
  ctx.textAlign="left";
  ctx.fillText(pair.visual.tag,105,114);

  drawTopLogo(ctx,assets.logo);
  drawBigTitle(ctx,pair.visual.title);

  // divider
  ctx.strokeStyle="rgba(255,255,255,.075)";
  ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.moveTo(82,652);
  ctx.lineTo(998,652);
  ctx.stroke();

  // small mechanism label
  ctx.fillStyle="#7f89ad";
  ctx.font="800 21px Inter, sans-serif";
  ctx.letterSpacing="2px";
  ctx.fillText("ASTY SYSTEM MECHANICS",82,704);

  drawWolfArea(ctx,assets.wolf);
  drawBottomText(ctx,pair.visual);
}

/* =========================
   COPY / DOWNLOAD
   ========================= */

async function copyText(text){
  try{
    await navigator.clipboard.writeText(text);
    showToast("Text copied");
  }catch(err){
    console.error(err);
    showToast("Copy blocked by browser");
  }
}

async function copyCanvas(canvas){
  if(!navigator.clipboard || typeof ClipboardItem==="undefined"){
    showToast("Image copy not supported");
    return;
  }

  canvas.toBlob(async blob=>{
    if(!blob){
      showToast("Could not create image");
      return;
    }

    try{
      await navigator.clipboard.write([
        new ClipboardItem({"image/png":blob})
      ]);
      showToast("Image copied");
    }catch(err){
      console.error(err);
      showToast("Image copy blocked - use Download PNG");
    }
  },"image/png");
}

function downloadCanvas(canvas,index){
  const a=document.createElement("a");
  a.href=canvas.toDataURL("image/png");
  a.download=`ASTY-Team-Content-${index+1}.png`;
  a.click();
  showToast("PNG downloaded");
}

let toastTimer=null;
function showToast(message){
  const toast=document.getElementById("toast");
  toast.textContent=message;
  toast.classList.add("show");

  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toast.classList.remove("show"),1600);
}

/* =========================
   EVENTS
   ========================= */

document.getElementById("generateAllBtn").addEventListener("click",()=>{
  generateThree();
  showToast("3 new content pairs generated");
});

document.getElementById("pairs").addEventListener("click",e=>{
  const row=e.target.closest(".pair");
  if(!row) return;

  const index=Number(row.dataset.index);

  if(e.target.closest(".copy-text-btn")){
    copyText(currentPairs[index].post.text);
    return;
  }

  if(e.target.closest(".new-pair-btn")){
    regenerateOne(index);
    return;
  }

  if(e.target.closest(".copy-image-btn")){
    const canvas=document.getElementById(`canvas-${index}`);
    copyCanvas(canvas);
    return;
  }

  if(e.target.closest(".download-image-btn")){
    const canvas=document.getElementById(`canvas-${index}`);
    downloadCanvas(canvas,index);
  }
});

/* Site logo fallback is intentionally minimal. */
document.getElementById("siteLogo").addEventListener("error",e=>{
  e.currentTarget.style.display="none";
});

/* Initial content */
generateThree();
</script>
