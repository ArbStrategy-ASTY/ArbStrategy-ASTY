function bytesToBase64(bytes) {
let binary = "";
const array =
bytes instanceof Uint8Array
? bytes
: new Uint8Array(bytes);
for (
let i = 0;
i < array.length;
i++
) {
binary +=
String.fromCharCode(
array[i]
);
}
return btoa(binary);
}
function signatureToBase58(
signature

typeof signature === "string"

signature instanceof Uint8Array

function parseUnitsExact(
value,
decimals
) {
const text =
String(value)
.trim();
if (
!/^\d+(\.\d+)?$/.test(text)

throw new Error(

/* ==================================================

================================================== */
function buildSolTransaction(
context
) {
const from =
new PublicKey(
context.from
);
const to =
new PublicKey(
context.to
);
const lamports =
parseUnitsExact(
context.amount,
9
);
const transaction =
new Transaction();
transaction.feePayer =
from;
transaction.recentBlockhash =
context.blockhash;
transaction.add(
SystemProgram.transfer({
fromPubkey:
from,
toPubkey:
to,
lamports
})
);
return transaction;
}
/* ==================================================
BUILD USDC DEPOSIT
================================================== */
async function buildUsdcTransaction(
context
) {
const from =
new PublicKey(
context.from
);
const to =
new PublicKey(
context.to
);
const mint =
new PublicKey(
USDC_MINT
);
const rawAmount =
parseUnitsExact(
context.amount,
6
);
const sourceAta =
await getAssociatedTokenAddress(
mint,
from,
false,
TOKEN_PROGRAM_ID,
ASSOCIATED_TOKEN_PROGRAM_ID
);
const destinationAta =
await getAssociatedTokenAddress(
mint,
to,
false,
TOKEN_PROGRAM_ID,
ASSOCIATED_TOKEN_PROGRAM_ID
);
const transaction =
new Transaction();
transaction.feePayer =
from;
transaction.recentBlockhash =
context.blockhash;
/*
* Safe to include every time.
*
* If the Rebound USDC ATA already
* exists, this is effectively a no-op.
*/
transaction.add(
createAssociatedTokenAccountIdempotentInstruction(
from,
destinationAta,
to,
mint,
TOKEN_PROGRAM_ID,
ASSOCIATED_TOKEN_PROGRAM_ID
)
);
transaction.add(
createTransferCheckedInstruction(
sourceAta,
mint,
destinationAta,
from,
rawAmount,
6,
[],
TOKEN_PROGRAM_ID
)
);
return transaction;
}

================================================== */
async function waitForConfirmation(
signature
) {
for (
let attempt = 0;
attempt < 30;
attempt++
) {
await sleep(
2000
);
try {
const token =
await getAccessToken();
if (!token) {
continue;
}
const response =
await fetch(
`${API_BASE}/transaction/status?signature=${encodeURIComponent(signature)}`,
{
headers: {
"Authorization":
`Bearer ${token}`
}
}
);
if (!response.ok) {
continue;
}
const result =
await response.json();
if (
result?.transactionError
) {
throw new Error(
"The Solana transaction failed."
);
}
if (
result?.confirmed
) {
return true;
}
}
catch (err) {
if (
err?.message ===
"The Solana transaction failed."
) {
throw err;
}
}
}
return false;
}

async function sendDeposit() {

!depositAsset ||
depositBusy

return;
}
setError("");
setDepositMessage("");
setDepositState(null);
const amount =
String(
depositAmount
).trim();
if (
!amount ||
Number(amount) <= 0
) {
setError(
"Enter a valid deposit amount."
);
return;
}
if (
!connectedPhantomWallet ||
!connectedPhantomWallet.address
) {
setError(
"Phantom must be connected before making a deposit."
);
return;
}
setDepositBusy(true);
try {
/*
* Get authoritative sender,
* destination and fresh blockhash
* from the backend.
*/
const token =
await getAccessToken();
if (!token) {
throw new Error(
"Your login session has expired."
);
}
const contextResponse =
await fetch(
`${API_BASE}/deposit/context`,
{
method:
"POST",
headers: {
"Content-Type":
"application/json",
"Authorization":
`Bearer ${token}`
},
body:
JSON.stringify({
asset:
depositAsset,
amount
})
}
);
const context =
await contextResponse.json();
if (
!contextResponse.ok
) {
throw new Error(
context?.message ||
"Deposit could not be prepared."
);
}
/*
* Make sure the wallet currently
* signing is exactly the wallet
* registered with Rebound.
*/
if (
connectedPhantomWallet
.address !==
context.from
) {
throw new Error(
"The connected Phantom wallet does not match your Rebound account."
);
}
let transaction;
if (
depositAsset ===
"SOL"
) {
transaction =
buildSolTransaction(
context
);
}
else {
transaction =
await buildUsdcTransaction(
context
);
}
/*
* Privy expects the encoded
* unsigned transaction.
*
* Phantom then performs the actual
* signing and broadcasting.
*/
const serialized =
transaction.serialize({
requireAllSignatures:
false,
verifySignatures:
false
});
const result =
await signAndSendTransaction({
transaction:
new Uint8Array(
serialized
),
wallet:
connectedPhantomWallet,
options: {
skipSimulation:
false,
uiOptions: {
showWalletUIs:
true
}
}
});
const signature =
signatureToBase58(
result.signature
);
setDepositSignature(
signature
);
setDepositState(
"pending"
);
setDepositMessage(
`${depositAsset} deposit sent. Waiting for Solana confirmation…`
);
/*
* Close amount modal after the
* wallet successfully sent it.
*/
setDepositAsset(null);
setDepositAmount("");
const confirmed =
await waitForConfirmation(
signature
);
if (
confirmed
) {
setDepositState(
"success"
);
setDepositMessage(
`${depositAsset} deposit confirmed ✓`
);
/*
* Immediately refresh the
* on-chain balance.
*/
await loadBalance();
}
else {
setDepositState(
"pending"
);
setDepositMessage(
"Transaction sent. Confirmation is taking longer than expected; the balance will refresh automatically."
);
}
setDepositBusy(false);
}
catch (err) {
console.error(
"Deposit error:",
err
);
setDepositBusy(false);
const message =
String(
err?.message ||
err ||
""
);
if (
message
.toLowerCase()
.includes(
"user rejected"
)
||
message
.toLowerCase()
.includes(
"cancelled"
)
||
message
.toLowerCase()
.includes(
"canceled"
)
) {
setError(
"The deposit was cancelled in Phantom."
);
return;
}
setError(
message ||
"The deposit could not be completed."
);
}
}

);

!config?.policyId

);

* additional signer to this embedded

* restricted trading policy.

address:
reboundAddress,
signers: [
{
signerId:
config.signerId,
policyIds: [
config.policyId
]
}
]
});

true
);
setAutomationBusy(false);
}
catch (err) {

"Enable automated trading:",

);

String(
err?.message ||
err ||
""
);

try {
const token =
await getAccessToken();
if (!token) {
throw new Error(
"Your login session has expired."
);
}
const response =
await fetch(
`${API_BASE}/trading/test-swap`,
{
method:
"POST",
headers: {
"Content-Type":
"application/json",
"Authorization":
`Bearer ${token}`
},
body:
JSON.stringify({
confirm:
"TEST_SWAP_0_10_USDC_TO_SOL"
})
}
);
let result = null;
try {
result =
await response.json();
} catch {
result = {
status:
"error",
message:
"The server returned an invalid response."
};
}
if (!response.ok) {
setTestSwapModalOpen(false);
setTestSwapResult({
state:
"error",
message:
result?.message ||
"The 0.10 USDC test swap could not be submitted.",
stage:
result?.stage ||
null
});
setTestSwapBusy(false);
return;
}
const signature =
result?.signature ||
"";
if (!signature) {
throw new Error(
"The server did not return a Solana transaction signature."
);
}
setTestSwapSignature(
signature
);
setTestSwapModalOpen(false);
setTestSwapResult({
state:
"pending",
message:
"0.10 USDC test swap submitted. Waiting for Solana confirmation…"
});
const confirmed =
await waitForConfirmation(
signature
);
if (
confirmed
) {
setTestSwapResult({
state:
"success",
message:
"Test Swap Confirmed ✓ 0.10 USDC was swapped to SOL through Jupiter using the Rebound backend signer."
});
await loadBalance();
} else {
setTestSwapResult({
state:
"pending",
message:
"The test swap was submitted, but confirmation is taking longer than expected. Check the transaction on Solscan."
});
}
setTestSwapBusy(false);
}
catch (err) {
console.error(
"Test swap error:",
err
);
setTestSwapModalOpen(false);
setTestSwapBusy(false);
setTestSwapResult({
state:
"error",
message:
err?.message ||
"The 0.10 USDC test swap could not be completed."
});
}
}
