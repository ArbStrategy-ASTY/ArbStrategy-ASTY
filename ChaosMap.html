*{

html{

body{

  overflow-x:hidden;
}

a{

  text-decoration:none;
}

.topbar{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(5,8,20,.92);
  backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(255,255,255,.1);
}

.nav{
  max-width:1440px;
  margin:auto;
  min-height:72px;
  padding:12px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
}

.brand{
  display:flex;
  align-items:center;
  gap:13px;
}

.brand-logo{
  width:46px;
  height:46px;
  border-radius:50%;
  background:rgba(255,255,255,.04);
  box-shadow:0 0 24px rgba(124,58,237,.45);
}

.brand-title{
  font-size:21px;
  font-weight:950;
  letter-spacing:-.2px;
}

.brand-sub{
  margin-top:2px;
  font-size:12px;
  color:#a9a3c5;
  font-weight:700;
}

.nav-links{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
}

.nav-pill{
  padding:9px 13px;
  border-radius:999px;
  background:rgba(255,255,255,.055);
  border:1px solid rgba(167,139,250,.24);
  color:#dad6ea;
  font-size:13px;
  font-weight:850;
  transition:.18s ease;
}

.nav-pill:hover{
  transform:translateY(-1px);
  background:rgba(255,255,255,.09);
  color:#fff;
}

.nav-pill.primary{
  background:linear-gradient(135deg,#8b5cf6,#6d28d9);
  color:#fff;
}

.nav-pill.cyan{
  background:linear-gradient(135deg,#06b6d4,#0891b2);
  color:#fff;
  border-color:transparent;
}

.nav-pill.orange{
  background:linear-gradient(135deg,#f59e0b,#ea580c);
  color:#fff;
  border-color:transparent;
}

.page{
  max-width:1440px;
  margin:auto;
  padding:14px 14px 28px;
}

.top-panel{
  display:grid;
  grid-template-columns:1.2fr .8fr;
  gap:12px;
  margin-bottom:12px;
}

.info-card,
.stat{
  border-radius:16px;
  padding:14px 16px;
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.09);
  backdrop-filter:blur(12px);
}

.info-card h1{
  margin:0;
  font-size:30px;
  font-weight:950;
  letter-spacing:-.7px;
}

.status-line{
  margin-top:8px;
  font-size:12px;
  color:#9f98bb;
  font-weight:650;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.stat-label{
  font-size:11px;
  color:#c9b8ff;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.3px;
  margin-bottom:7px;
}

.stat-value{
  font-size:21px;
  line-height:1.15;
  font-weight:950;
  word-break:break-word;
}

.map-frame{
  position:relative;
  width:100%;
  height:calc(100vh - 190px);
  min-height:620px;
  border-radius:16px;
  overflow:hidden;
  background:#050814;
  border:1px solid rgba(255,255,255,.12);
  box-shadow:
    0 0 38px rgba(124,58,237,.12),
    inset 0 0 50px rgba(255,255,255,.015);
}

#heatmap{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

.tile{
  position:absolute;
  padding:0;
  border:1px solid rgba(5,8,20,.92);
  background:transparent;
  color:#fff;
  overflow:hidden;
  cursor:pointer;
  font-family:inherit;
  text-align:center;
}

.tile:hover{
  z-index:10;
}

.tile:hover .tile-inner{
  filter:brightness(1.12) saturate(1.08);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.25);
}

.tile-inner{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:6px;
  background:
    radial-gradient(circle at 28% 20%,rgba(255,255,255,.22),transparent 32%),
    linear-gradient(135deg,var(--c1),var(--c2));
  transition:.16s ease;
}

.tile-token{
  max-width:100%;
  font-weight:950;
  line-height:.95;
  letter-spacing:-.045em;
  font-size:var(--tokenSize);
  text-shadow:0 2px 9px rgba(0,0,0,.42);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.tile-percent{
  margin-top:6px;
  font-weight:900;
  line-height:1;
  font-size:var(--percentSize);
  color:rgba(255,255,255,.92);
  text-shadow:0 2px 9px rgba(0,0,0,.42);
}

.tile-fees{

  font-weight:850;
  line-height:1;
  font-size:var(--feesSize);
  color:rgba(255,255,255,.82);
  text-shadow:0 2px 9px rgba(0,0,0,.42);
}

.tile-volume{

  line-height:1;
  font-size:var(--smallSize);
  color:rgba(255,255,255,.74);
  text-shadow:0 2px 9px rgba(0,0,0,.42);
}

.detail-panel{

const CHUNK_SIZE = 25;
let latestRows = [];

function fmtUsd(n){
  if(!n || Number.isNaN(n)) return "$0.00";
  if(n >= 1e9) return "$" + (n / 1e9).toFixed(1) + "B";
  if(n >= 1e6) return "$" + (n / 1e6).toFixed(1) + "M";
  if(n >= 1e3) return "$" + (n / 1e3).toFixed(1) + "K";
  return "$" + n.toFixed(2);
}

function formatFee(percentValue){
  return percentValue.toFixed(2).replace(/\.00$/,"") + "%";
}

function getTokenName(label){
  return label.replace("ASTY/","").replace("ASTY / ","");
}

function chunkArray(arr,size){
  const chunks=[];
  for(let i=0;i<arr.length;i+=size){
    chunks.push(arr.slice(i,i+size));
  }
  return chunks;
}

async function fetchGeckoChunk(chunk){
  const ids = chunk.map(([id]) => id).join(",");
  const encodedIds = encodeURIComponent(ids);
  const url = `https://api.geckoterminal.com/api/v2/networks/solana/pools/multi/${encodedIds}?include=base_token&include_volume_breakdown=false&include_composition=false`;
  const response = await fetch(url);
  if(!response.ok) throw new Error("GeckoTerminal request failed");
  const data = await response.json();
  return Array.isArray(data.data) ? data.data : [];
}

  return ["#7f0d1b","#5c0a14"];
}

  document.getElementById("panelFeeRate").textContent = formatFee(pool.feePercent);
  document.getElementById("panelLink").href = `https://www.geckoterminal.com/solana/pools/${pool.id}`;

function prepareHeatWeights(rows){
  return rows.map(row=>{
    const normalized = Math.max(row.chaosScore,0.6);

    return {
      ...row,
      weight:Math.pow(normalized,0.78)
    };
  });
}

function splitBalanced(items){
  const total = items.reduce((sum,item)=>sum + item.weight,0);
  const target = total / 2;

  let bestIndex = 1;
  let bestDiff = Infinity;
  let running = 0;

  for(let i=0;i<items.length - 1;i++){
    running += items[i].weight;
    const diff = Math.abs(target - running);

    if(diff < bestDiff){
      bestDiff = diff;
      bestIndex = i + 1;
    }
  }

  return [
    items.slice(0,bestIndex),
    items.slice(bestIndex)
  ];
}

function binaryTreemap(items,rect,result){
  if(!items.length) return;

  if(items.length === 1){
    result.push({
      ...items[0],
      x:rect.x,
      y:rect.y,
      w:rect.w,
      h:rect.h
    });
    return;
  }

  const [a,b] = splitBalanced(items);

  const sumA = a.reduce((sum,item)=>sum + item.weight,0);
  const sumB = b.reduce((sum,item)=>sum + item.weight,0);
  const total = sumA + sumB;

  if(rect.w >= rect.h){
    const wA = rect.w * (sumA / total);

    binaryTreemap(a,{x:rect.x,y:rect.y,w:wA,h:rect.h},result);
    binaryTreemap(b,{x:rect.x + wA,y:rect.y,w:rect.w - wA,h:rect.h},result);
  }else{
    const hA = rect.h * (sumA / total);

    binaryTreemap(a,{x:rect.x,y:rect.y,w:rect.w,h:hA},result);
    binaryTreemap(b,{x:rect.x,y:rect.y + hA,w:rect.w,h:rect.h - hA},result);
  }
}

function renderHeatmap(rows){
  const container = document.getElementById("heatmap");
  container.innerHTML = "";

  const width = container.clientWidth;
  const height = container.clientHeight;

  if(!width || !height || !rows.length) return;

  const prepared = prepareHeatWeights(rows);
  const layout = [];

  binaryTreemap(prepared,{x:0,y:0,w:width,h:height},layout);

  layout.forEach(item=>{
    const tile = document.createElement("button");
    tile.className = "tile";

    const gap = 1;

    tile.style.left = item.x + gap + "px";
    tile.style.top = item.y + gap + "px";
    tile.style.width = Math.max(1,item.w - gap * 2) + "px";
    tile.style.height = Math.max(1,item.h - gap * 2) + "px";

    const [c1,c2] = getColors(item.chaosScore);
    tile.style.setProperty("--c1",c1);
    tile.style.setProperty("--c2",c2);

    const area = item.w * item.h;
    const minSide = Math.min(item.w,item.h);
    const token = getTokenName(item.label);

    const tokenFitWidth = item.w / Math.max(token.length,4) * 1.45;
    const tokenFitHeight = item.h * 0.32;
    const tokenSize = Math.max(7,Math.min(54,Math.sqrt(area) * 0.19,tokenFitWidth,tokenFitHeight));

    const percentSize = Math.max(7,Math.min(24,Math.sqrt(area) * 0.09,item.h * 0.18));
    const feesSize = Math.max(7,Math.min(16,Math.sqrt(area) * 0.065,item.h * 0.14));
    const smallSize = Math.max(7,Math.min(13,Math.sqrt(area) * 0.05,item.h * 0.11));

    tile.style.setProperty("--tokenSize",tokenSize + "px");
    tile.style.setProperty("--percentSize",percentSize + "px");
    tile.style.setProperty("--feesSize",feesSize + "px");
    tile.style.setProperty("--smallSize",smallSize + "px");

    const showPercent = item.w > 34 && item.h > 32;
    const showFees = item.w > 76 && item.h > 62;
    const showVolume = item.w > 120 && item.h > 104;

    tile.innerHTML = `
      <div class="tile-inner">
        <div class="tile-token">${token}</div>
        ${showPercent ? `<div class="tile-percent">${Math.round(item.chaosScore)}%</div>` : ""}
        ${showFees ? `<div class="tile-fees">${fmtUsd(item.fees24h)}</div>` : ""}
        ${showVolume ? `<div class="tile-volume">Vol ${fmtUsd(item.volume24h)}</div>` : ""}
      </div>
    `;

    tile.addEventListener("click",()=>updatePanel(item));
    container.appendChild(tile);
  });
}

async function load(){
  const statusLine = document.getElementById("statusLine");
  statusLine.textContent = "Loading GeckoTerminal pool data...";

  try{
    const chunks = chunkArray(pools,CHUNK_SIZE);
    const responses = await Promise.all(chunks.map(fetchGeckoChunk));
    const flatPools = responses.flat();

    const geckoMap = new Map();

    for(const item of flatPools){
      const address = item?.attributes?.address;
      if(address) geckoMap.set(address,item);
    }

    let rows = pools.map(([id,label,feePercent])=>{
      const item = geckoMap.get(id);
      if(!item) return null;

      const attrs = item.attributes || {};
      const fee = feePercent / 100;
      const volume24h = parseFloat(attrs.volume_usd?.h24 || "0");
      const fees24h = volume24h * fee;

      return {
        id,
        label,
        feePercent,
        volume24h,
        fees24h
      };
    }).filter(Boolean).sort((a,b)=>b.fees24h - a.fees24h);

    const highest = rows[0]?.fees24h || 0;
    const total = rows.reduce((sum,row)=>sum + row.fees24h,0);

    rows = rows.map(row=>({
      ...row,
      chaosScore:highest > 0 ? (row.fees24h / highest) * 100 : 0
    }));

    latestRows = rows;

    document.getElementById("systemOutput").textContent = fmtUsd(total);
    document.getElementById("topPool").textContent = rows[0]?.label || "-";
    statusLine.textContent = `Loaded ${rows.length} ASTY pools. Auto-updating every 60s.`;

    renderHeatmap(rows);
    updatePanel(rows[0]);

  }catch(error){
    console.error(error);
    statusLine.textContent = "Error loading GeckoTerminal data.";
  }
}

function rerender(){
  if(latestRows.length){
    renderHeatmap(latestRows);
  }
}

load();
setInterval(load,60000);

let resizeTimer;
window.addEventListener("resize",()=>{
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(rerender,180);
});
</script>
