name: ASTY 68-pool volume collector test
on:
  push:
    branches: [test/asty-volume-egress]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Collect GeckoTerminal and DEX Screener volume for all dashboard pools
        run: node scripts/asty-volume-snapshot.mjs
      - name: Commit snapshot to test branch (permission check)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/asty-pool-volume.json
          git commit -m 'test: automated ASTY pool data publication' || true
          git push origin HEAD:test/asty-volume-egress
      - name: Upload diagnostic snapshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: asty-pool-volume-snapshot-test
          path: data/asty-pool-volume.json
