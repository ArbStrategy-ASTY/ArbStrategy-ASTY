<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#09070f">

  <title>ASTY Rebound</title>

  <style>
    :root {
      --bg: #09070f;
      --panel: #12101a;
      --panel2: #171321;
      --border: #302640;
      --text: #f4efff;
      --muted: #a79db7;
      --purple: #b18cff;
      --purple2: #7a4dff;
      --green: #6ee7a8;
      --yellow: #ffd479;
      --red: #ff7b8b;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;

      background:
        radial-gradient(
          circle at 50% -20%,
          rgba(138, 91, 255, 0.20),
          transparent 42%
        ),
        var(--bg);

      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    body {
      min-height: 100vh;
    }

    .wrap {
      width: min(720px, 100%);
      margin: 0 auto;

      padding:
        calc(22px + env(safe-area-inset-top))
        18px
        calc(34px + env(safe-area-inset-bottom));
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 30px;
    }

    .mark {
      width: 40px;
      height: 40px;
      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          var(--purple),
          var(--purple2)
        );

      box-shadow:
        0 0 28px rgba(177,140,255,0.30);
    }

    .brand strong {
      display: block;
      font-size: 18px;
    }

    .brand span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .hero {
      padding: 8px 2px 24px;
    }

    h1 {
      margin: 0 0 12px;

      font-size: clamp(34px, 9vw, 50px);
      line-height: 1;

      background:
        linear-gradient(
          90deg,
          #ffffff,
          var(--purple)
        );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .lead {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
    }

    .card {
      padding: 20px;

      border: 1px solid var(--border);
      border-radius: 22px;

      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,0.025),
          rgba(255,255,255,0.012)
        ),
        var(--panel);

      box-shadow:
        0 18px 60px rgba(0,0,0,0.24);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 9px;

      margin-bottom: 18px;

      color: var(--muted);
      font-size: 13px;
    }

    .dot {
      width: 9px;
      height: 9px;

      flex: 0 0 auto;

      border-radius: 50%;
      background: #666;
    }

    .dot.loading {
      background: var(--yellow);

      box-shadow:
        0 0 14px rgba(255,212,121,0.60);
    }

    .dot.ready {
      background: var(--green);

      box-shadow:
        0 0 14px rgba(110,231,168,0.70);
    }

    button {
      width: 100%;

      appearance: none;
      border: 0;
      border-radius: 15px;

      padding: 15px 18px;

      font-size: 16px;
      font-weight: 750;

      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .primary {
      color: #120a22;

      background:
        linear-gradient(
          90deg,
          #c29dff,
          #9068ff
        );

      box-shadow:
        0 8px 28px rgba(144,104,255,0.24);
    }

    .secondary {
      margin-top: 12px;

      color: var(--text);
      background: transparent;

      border: 1px solid var(--border);
    }

    .wallet {
      margin-top: 4px;
      padding: 16px;

      background: var(--panel2);

      border: 1px solid #292136;
      border-radius: 16px;
    }

    .wallet-label {
      margin-bottom: 10px;

      color: var(--muted);

      font-size: 11px;
      font-weight: 650;

      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .wallet-line {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .wallet-address {
      min-width: 0;
      flex: 1;

      color: var(--text);

      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;

      font-size: 13px;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .copy {
      width: auto;
      flex: 0 0 auto;

      padding: 8px 12px;

      border-radius: 10px;

      color: var(--purple);

      background:
        rgba(177,140,255,0.10);

      border:
        1px solid rgba(177,140,255,0.24);

      font-size: 12px;
    }

    .message {
      margin-top: 14px;

      padding: 12px 13px;

      border-radius: 13px;

      background:
        rgba(177,140,255,0.07);

      border:
        1px solid rgba(177,140,255,0.18);

      color: #d8c9f7;

      font-size: 12px;
      line-height: 1.5;
    }

    .error {
      margin-top: 14px;

      padding: 12px 13px;

      border-radius: 13px;

      background:
        rgba(255,123,139,0.08);

      border:
        1px solid rgba(255,123,139,0.25);

      color: #ffc2c9;

      font-size: 13px;
      line-height: 1.45;
    }

    .small {
      margin: 17px 2px 0;

      color: var(--muted);

      font-size: 12px;
      line-height: 1.5;
    }
  </style>


  <script type="importmap">
  {
    "imports": {
      "react":
        "https://esm.sh/react@18.3.1",

      "react/jsx-runtime":
        "https://esm.sh/react@18.3.1/jsx-runtime",

      "react-dom":
        "https://esm.sh/react-dom@18.3.1",

      "react-dom/client":
        "https://esm.sh/react-dom@18.3.1/client"
    }
  }
  </script>
</head>


<body>

<div id="root"></div>


<script type="module">

import React, {
  useEffect,
  useMemo,
  useRef,
  useState
} from "react";


import {
  createRoot
} from "react-dom/client";


import {
  PrivyProvider,
  usePrivy,
  useConnectWallet,
  useLoginWithSiws
} from "https://esm.sh/@privy-io/react-auth@3.43.0?external=react,react-dom";


import {
  useWallets,
  useCreateWallet,
  toSolanaWalletConnectors
} from "https://esm.sh/@privy-io/react-auth@3.43.0/solana?external=react,react-dom";



const APP_ID =
  "cmu6qkw8h029x0cjtidese1il";


const API_BASE =
  "https://asty-rebound-api.mail-timothy.workers.dev";


const e =
  React.createElement;



/*
====================================================
HELPERS
====================================================
*/


function bytesToBase64(bytes) {

  let binary = "";

  const array =
    bytes instanceof Uint8Array
      ? bytes
      : new Uint8Array(bytes);


  for (
    let i = 0;
    i < array.length;
    i++
  ) {

    binary +=
      String.fromCharCode(
        array[i]
      );

  }


  return btoa(binary);
}



function isEmbeddedWallet(wallet) {

  if (!wallet) {
    return false;
  }


  const client =
    String(
      wallet.walletClientType || ""
    ).toLowerCase();


  const connector =
    String(
      wallet.connectorType || ""
    ).toLowerCase();


  const name =
    String(
      wallet.standardWallet?.name || ""
    ).toLowerCase();


  return (
    client.includes("privy") ||
    connector.includes("embedded") ||
    name.includes("privy")
  );
}



function App() {

  const {
    ready,
    authenticated,
    user,
    logout,
    getAccessToken
  } = usePrivy();


  const {
    ready: walletsReady,
    wallets
  } = useWallets();


  const {
    generateSiwsMessage,
    loginWithSiws
  } = useLoginWithSiws();


  const {
    createWallet
  } = useCreateWallet();



  const [
    connectedWallet,
    setConnectedWallet
  ] = useState(null);


  const [
    createdWallet,
    setCreatedWallet
  ] = useState(null);


  const [
    connecting,
    setConnecting
  ] = useState(false);


  const [
    signingIn,
    setSigningIn
  ] = useState(false);


  const [
    creatingWallet,
    setCreatingWallet
  ] = useState(false);


  const [
    error,
    setError
  ] = useState("");


  const [
    syncState,
    setSyncState
  ] = useState("waiting");


  const [
    copied,
    setCopied
  ] = useState(false);


  const creationAttempted =
    useRef(false);


  const syncAttempted =
    useRef("");



  /*
  ==================================================
  PRIVY WALLET CONNECTION
  ==================================================
  */


  const {
    connectWallet
  } = useConnectWallet({

    onSuccess: ({wallet}) => {

      setConnectedWallet(wallet);

      setConnecting(false);

      authenticateWallet(wallet);

    },


    onError: (err) => {

      console.error(
        "Wallet connection error:",
        err
      );

      setConnecting(false);


      const message =
        err?.message ||
        String(err) ||
        "";


      if (
        message
          .toLowerCase()
          .includes("cancel")
      ) {

        return;

      }


      setError(
        message ||
        "Could not connect Phantom."
      );

    }

  });



  /*
  ==================================================
  LOGIN WITH CONNECTED SOLANA WALLET
  ==================================================
  */


  async function authenticateWallet(wallet) {

    if (
      !wallet ||
      authenticated ||
      signingIn
    ) {

      return;
    }


    setSigningIn(true);

    setError("");


    try {

      const message =
        await generateSiwsMessage({

          address:
            wallet.address

        });


      const encodedMessage =
        new TextEncoder()
          .encode(message);


      const signed =
        await wallet.signMessage({

          message:
            encodedMessage

        });


      const signatureBytes =
        signed?.signature ||
        signed;


      if (!signatureBytes) {

        throw new Error(
          "Phantom did not return a login signature."
        );

      }


      await loginWithSiws({

        message,

        signature:
          bytesToBase64(
            signatureBytes
          )

      });


      setSigningIn(false);

    }

    catch (err) {

      console.error(
        "Phantom sign-in error:",
        err
      );


      setSigningIn(false);


      const message =
        err?.message ||
        String(err) ||
        "";


      if (
        message
          .toLowerCase()
          .includes("user rejected")
      ) {

        setError(
          "The Phantom login request was cancelled."
        );

        return;

      }


      setError(
        message ||
        "Could not complete the Phantom login."
      );

    }

  }



  /*
  ==================================================
  CONNECT BUTTON
  ==================================================
  */


  async function handleConnect() {

    setError("");

    setConnecting(true);


    try {

      await connectWallet({

        description:
          "Connect Phantom to ASTY Rebound",

        walletList: [
          "phantom"
        ],

        walletChainType:
          "solana-only"

      });

    }

    catch (err) {

      console.error(err);

      setConnecting(false);

    }

  }



  /*
  ==================================================
  PHANTOM ADDRESS
  ==================================================
  */


  const linkedPhantom =
    useMemo(
      () => {

        if (
          !user?.linkedAccounts
        ) {

          return null;
        }


        return (

          user.linkedAccounts.find(
            account => {

              const client =
                String(
                  account?.walletClientType ||
                  ""
                ).toLowerCase();


              return (

                account?.type === "wallet"

                &&

                client.includes("phantom")

              );

            }
          )

          ||

          null

        );

      },

      [user]
    );



  const phantomAddress =

    linkedPhantom?.address

    ||

    connectedWallet?.address

    ||

    "";



  /*
  ==================================================
  EXISTING REBOUND WALLET
  ==================================================
  */


  const linkedEmbedded =
    useMemo(
      () => {

        if (
          !user?.linkedAccounts
        ) {

          return null;
        }


        return (

          user.linkedAccounts.find(
            account => {

              if (
                account?.type !== "wallet"
              ) {

                return false;
              }


              const chain =
                String(
                  account?.chainType ||
                  ""
                ).toLowerCase();


              const client =
                String(
                  account?.walletClientType ||
                  ""
                ).toLowerCase();


              const connector =
                String(
                  account?.connectorType ||
                  ""
                ).toLowerCase();


              return (

                chain === "solana"

                &&

                account?.address !==
                  phantomAddress

                &&

                (
                  client.includes("privy") ||
                  connector.includes("embedded")
                )

              );

            }
          )

          ||

          null

        );

      },

      [
        user,
        phantomAddress
      ]
    );



  const embeddedFromWallets =
    useMemo(
      () => {

        return (

          wallets.find(
            wallet => {

              return (

                wallet?.address !==
                  phantomAddress

                &&

                isEmbeddedWallet(
                  wallet
                )

              );

            }
          )

          ||

          null

        );

      },

      [
        wallets,
        phantomAddress
      ]
    );



  const reboundWallet =

    linkedEmbedded

    ||

    embeddedFromWallets

    ||

    createdWallet

    ||

    null;



  const reboundAddress =
    reboundWallet?.address || "";



  const reboundWalletId =
    reboundWallet?.id || null;



  /*
  ==================================================
  CREATE REBOUND WALLET IF NEEDED
  ==================================================
  */


  useEffect(
    () => {

      if (
        !ready ||
        !walletsReady ||
        !authenticated
      ) {

        return;
      }


      if (reboundAddress) {

        creationAttempted.current =
          true;

        sessionStorage.removeItem(
          "asty_rebound_wallet_reload"
        );

        return;
      }


      if (
        creationAttempted.current
      ) {

        return;
      }


      /*
       * Give Privy a moment to load an
       * already existing embedded wallet.
       */
      const timer =
        setTimeout(
          async () => {

            if (
              reboundAddress ||
              creationAttempted.current
            ) {

              return;
            }


            creationAttempted.current =
              true;


            setCreatingWallet(true);


            try {

              const result =
                await createWallet();


              const wallet =
                result?.wallet ||
                result;


              if (
                wallet?.address
              ) {

                setCreatedWallet(
                  wallet
                );

              }


              setCreatingWallet(false);

            }

            catch (err) {

              console.error(
                "Rebound wallet:",
                err
              );


              setCreatingWallet(false);


              const message =
                String(
                  err?.message ||
                  err ||
                  ""
                );


              /*
               * If Privy says the wallet
               * already exists, reload once
               * so its wallet list is refreshed.
               */
              if (
                message
                  .toLowerCase()
                  .includes(
                    "already has an embedded wallet"
                  )
              ) {

                const reloaded =
                  sessionStorage.getItem(
                    "asty_rebound_wallet_reload"
                  );


                if (!reloaded) {

                  sessionStorage.setItem(
                    "asty_rebound_wallet_reload",
                    "1"
                  );


                  setTimeout(
                    () => {
                      location.reload();
                    },
                    400
                  );

                }


                return;
              }


              setError(
                "Your Rebound Wallet could not be loaded. Please try again."
              );

            }

          },

          2500
        );


      return () =>
        clearTimeout(timer);

    },

    [
      ready,
      walletsReady,
      authenticated,
      reboundAddress,
      createWallet
    ]
  );



  /*
  ==================================================
  BACKGROUND DATABASE SYNC
  ==================================================
  */


  useEffect(
    () => {

      if (
        !authenticated ||
        !user?.id ||
        !phantomAddress ||
        !reboundAddress
      ) {

        return;
      }


      const syncKey =
        `${user.id}:${phantomAddress}:${reboundAddress}`;


      if (
        syncAttempted.current ===
        syncKey
      ) {

        return;
      }


      syncAttempted.current =
        syncKey;


      let cancelled =
        false;


      async function syncAccount() {

        setSyncState(
          "syncing"
        );


        try {

          const token =
            await getAccessToken();


          if (!token) {

            throw new Error(
              "No login session."
            );

          }


          const response =
            await fetch(
              `${API_BASE}/account/sync`,
              {

                method:
                  "POST",

                headers: {

                  "Content-Type":
                    "application/json",

                  "Authorization":
                    `Bearer ${token}`

                },

                body:
                  JSON.stringify({

                    phantomAddress,

                    reboundWalletAddress:
                      reboundAddress,

                    reboundWalletId:
                      reboundWalletId

                  })

              }
            );


          const result =
            await response.json();


          if (!response.ok) {

            throw new Error(
              result?.message ||
              "Account setup failed."
            );

          }


          if (!cancelled) {

            setSyncState(
              "ready"
            );

          }

        }

        catch (err) {

          console.error(
            "Account sync:",
            err
          );


          if (!cancelled) {

            setSyncState(
              "error"
            );


            setError(
              "Your Rebound account could not be synchronized. Please try again."
            );

          }

        }

      }


      syncAccount();


      return () => {

        cancelled = true;

      };

    },

    [
      authenticated,
      user?.id,
      phantomAddress,
      reboundAddress,
      reboundWalletId,
      getAccessToken
    ]
  );



  /*
  ==================================================
  COPY
  ==================================================
  */


  async function copyWallet() {

    if (!reboundAddress) {
      return;
    }


    try {

      await navigator.clipboard.writeText(
        reboundAddress
      );


      setCopied(true);


      setTimeout(
        () => {
          setCopied(false);
        },
        1400
      );

    }

    catch {

      setCopied(false);

    }

  }



  /*
  ==================================================
  LOGOUT
  ==================================================
  */


  async function handleLogout() {

    setError("");

    setSyncState(
      "waiting"
    );


    syncAttempted.current =
      "";


    creationAttempted.current =
      false;


    setConnectedWallet(null);

    setCreatedWallet(null);


    await logout();

  }



  /*
  ==================================================
  DISPLAY STATUS
  ==================================================
  */


  const loading =
    !ready ||
    !walletsReady;


  const accountReady =

    authenticated

    &&

    Boolean(reboundAddress)

    &&

    syncState === "ready";



  let statusText =
    "Not connected";


  let dotClass =
    "dot";


  if (
    loading ||
    connecting ||
    signingIn ||
    creatingWallet ||
    syncState === "syncing"
  ) {

    statusText =
      authenticated
        ? "Setting up Rebound…"
        : "Connecting Phantom…";

    dotClass =
      "dot loading";

  }


  if (accountReady) {

    statusText =
      "Connected";

    dotClass =
      "dot ready";

  }



  /*
  ==================================================
  UI
  ==================================================
  */


  return e(

    "main",

    {
      className:
        "wrap"
    },


    e(

      "div",

      {
        className:
          "brand"
      },


      e(

        "div",

        {
          className:
            "mark"
        }

      ),


      e(

        "div",

        null,


        e(

          "strong",

          null,

          "ASTY Rebound"

        ),


        e(

          "span",

          null,

          "Automated dip & rebound strategy"

        )

      )

    ),



    e(

      "section",

      {
        className:
          "hero"
      },


      e(

        "h1",

        null,

        "Rebound"

      ),


      e(

        "p",

        {
          className:
            "lead"
        },

        "Connect Phantom and let ASTY Rebound watch the market for you."

      )

    ),



    e(

      "section",

      {
        className:
          "card"
      },


      e(

        "div",

        {
          className:
            "status"
        },


        e(

          "span",

          {
            className:
              dotClass
          }

        ),


        statusText

      ),



      !authenticated

      ?

      e(

        "button",

        {
          className:
            "primary",

          disabled:
            loading ||
            connecting ||
            signingIn,

          onClick:
            handleConnect
        },

        connecting ||
        signingIn
          ? "Connecting…"
          : "Connect Phantom"

      )

      :

      e(

        React.Fragment,

        null,


        reboundAddress

        ?

        e(

          "div",

          {
            className:
              "wallet"
          },


          e(

            "div",

            {
              className:
                "wallet-label"
            },

            "Your Rebound Wallet"

          ),


          e(

            "div",

            {
              className:
                "wallet-line"
            },


            e(

              "div",

              {
                className:
                  "wallet-address"
              },

              reboundAddress

            ),


            e(

              "button",

              {
                className:
                  "copy",

                onClick:
                  copyWallet
              },

              copied
                ? "Copied ✓"
                : "Copy"

            )

          )

        )

        :

        e(

          "div",

          {
            className:
              "message"
          },

          "Preparing your Rebound Wallet…"

        ),



        e(

          "button",

          {
            className:
              "secondary",

            onClick:
              handleLogout
          },

          "Log out"

        )

      ),



      /*
       * Fallback only.
       *
       * Normally authentication happens
       * automatically immediately after
       * the Phantom connection.
       */
      !authenticated &&
      connectedWallet &&
      !signingIn

      ?

      e(

        "button",

        {
          className:
            "secondary",

          onClick:
            () =>
              authenticateWallet(
                connectedWallet
              )
        },

        "Continue sign-in"

      )

      :

      null,



      error

      ?

      e(

        "div",

        {
          className:
            "error"
        },

        error

      )

      :

      null,



      e(

        "p",

        {
          className:
            "small"
        },

        "Prototype only. Deposits and automated trading are not active yet."

      )

    )

  );

}



/*
====================================================
PRIVY CONFIG
====================================================
*/


const connectors =
  toSolanaWalletConnectors();



createRoot(

  document.getElementById(
    "root"
  )

).render(

  e(

    PrivyProvider,
