<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#09070f">

  <title>ASTY Rebound</title>

  <style>
    :root {
      --bg: #09070f;
      --panel: #12101a;
      --panel2: #171321;
      --border: #302640;
      --text: #f4efff;
      --muted: #a79db7;

      --purple: #b18cff;
      --purple2: #7a4dff;

      --green: #6ee7a8;
      --yellow: #ffd479;
      --red: #ff7b8b;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;

      min-height: 100%;

      background:
        radial-gradient(
          circle at 50% -20%,
          rgba(138,91,255,0.20),
          transparent 42%
        ),
        var(--bg);

      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    body {
      min-height: 100vh;
    }

    .wrap {
      width: min(720px, 100%);

      margin: 0 auto;

      padding:
        calc(22px + env(safe-area-inset-top))
        18px
        calc(34px + env(safe-area-inset-bottom));
    }

    .brand {
      display: flex;
      align-items: center;

      gap: 12px;

      margin-bottom: 30px;
    }

    .mark {
      width: 40px;
      height: 40px;

      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          var(--purple),
          var(--purple2)
        );

      box-shadow:
        0 0 28px rgba(177,140,255,0.30);
    }

    .brand strong {
      display: block;

      font-size: 18px;
    }

    .brand span {
      display: block;

      margin-top: 3px;

      color: var(--muted);

      font-size: 12px;
    }

    .hero {
      padding:
        8px 2px 24px;
    }

    h1 {
      margin:
        0 0 12px;

      font-size:
        clamp(34px, 9vw, 50px);

      line-height: 1;

      background:
        linear-gradient(
          90deg,
          #ffffff,
          var(--purple)
        );

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;
    }

    .lead {
      margin: 0;

      color: var(--muted);

      font-size: 15px;

      line-height: 1.55;
    }

    .card {
      padding: 18px;

      border:
        1px solid var(--border);

      border-radius: 22px;

      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,0.025),
          rgba(255,255,255,0.012)
        ),
        var(--panel);

      box-shadow:
        0 18px 60px
        rgba(0,0,0,0.24);
    }

    .status {
      display: flex;
      align-items: center;

      gap: 9px;

      margin-bottom: 18px;

      color: var(--muted);

      font-size: 13px;
    }

    .dot {
      width: 9px;
      height: 9px;

      border-radius: 50%;

      background: #666;
    }

    .dot.connecting {
      background: var(--yellow);

      box-shadow:
        0 0 14px
        rgba(255,212,121,0.65);
    }

    .dot.ready {
      background: var(--green);

      box-shadow:
        0 0 14px
        rgba(110,231,168,0.70);
    }

    button {
      width: 100%;

      appearance: none;

      border: 0;

      border-radius: 15px;

      padding:
        15px 18px;

      font-size: 16px;

      font-weight: 750;

      cursor: pointer;
    }

    button:disabled {
      opacity: 0.48;

      cursor: not-allowed;
    }

    .primary {
      color: #120a22;

      background:
        linear-gradient(
          90deg,
          #c29dff,
          #9068ff
        );

      box-shadow:
        0 8px 28px
        rgba(144,104,255,0.24);
    }

    .secondary {
      margin-top: 10px;

      color: var(--text);

      background: transparent;

      border:
        1px solid var(--border);
    }

    .grid {
      display: grid;

      gap: 10px;

      margin-top: 18px;
    }

    .row {
      padding:
        13px 14px;

      border:
        1px solid #292136;

      border-radius: 15px;

      background:
        var(--panel2);
    }

    .label {
      margin-bottom: 6px;

      color: var(--muted);

      font-size: 11px;

      font-weight: 600;

      text-transform: uppercase;

      letter-spacing: 0.08em;
    }

    .value {
      font-size: 14px;

      word-break: break-all;
    }

    .good {
      color: var(--green);
    }

    .waiting {
      color: var(--yellow);
    }

    .error {
      margin-top: 14px;

      padding:
        12px 13px;

      border:
        1px solid
        rgba(255,123,139,0.25);

      border-radius: 13px;

      background:
        rgba(255,123,139,0.08);

      color: #ffc2c9;

      font-size: 13px;

      line-height: 1.45;
    }

    .info {
      margin-top: 14px;

      padding:
        12px 13px;

      border:
        1px solid
        rgba(177,140,255,0.20);

      border-radius: 13px;

      background:
        rgba(177,140,255,0.07);

      color: #d8c9f7;

      font-size: 12px;

      line-height: 1.5;
    }

    .small {
      margin:
        17px 2px 0;

      color: var(--muted);

      font-size: 12px;

      line-height: 1.5;
    }
  </style>


  <script type="importmap">

  {
    "imports": {

      "react":
        "https://esm.sh/react@18.3.1",

      "react/jsx-runtime":
        "https://esm.sh/react@18.3.1/jsx-runtime",

      "react-dom":
        "https://esm.sh/react-dom@18.3.1",

      "react-dom/client":
        "https://esm.sh/react-dom@18.3.1/client"

    }
  }

  </script>

</head>


<body>

<div id="root"></div>


<script type="module">

import React, {
  useEffect,
  useMemo,
  useState
} from "react";


import {
  createRoot
} from "react-dom/client";


import {

  PrivyProvider,

  usePrivy,

  useLoginWithSiws

} from "https://esm.sh/@privy-io/react-auth@3.43.0?external=react,react-dom";


import {

  useWallets,

  toSolanaWalletConnectors

} from "https://esm.sh/@privy-io/react-auth@3.43.0/solana?external=react,react-dom";



const APP_ID =
  "cmu6qkw8h029x0cjtidese1il";


const e =
  React.createElement;



/*
====================================================
HELPERS
====================================================
*/


function bytesToBase64(bytes) {

  let binary = "";

  const array =
    bytes instanceof Uint8Array
      ? bytes
      : new Uint8Array(bytes);


  for (
    let i = 0;
    i < array.length;
    i++
  ) {

    binary +=
      String.fromCharCode(
        array[i]
      );

  }


  return btoa(binary);

}



function getPhantomProvider() {

  /*
   * This is intentionally similar to
   * the direct Phantom approach we use
   * in ASTY Unlockr.
   */

  if (
    window.phantom?.solana?.isPhantom
  ) {

    return window.phantom.solana;

  }


  if (
    window.solana?.isPhantom
  ) {

    return window.solana;

  }


  return null;

}



function findPrivyWallet(wallets) {

  return (
    wallets.find(
      wallet => {

        const client =
          String(
            wallet?.walletClientType ||
            ""
          ).toLowerCase();


        const connector =
          String(
            wallet?.connectorType ||
            ""
          ).toLowerCase();


        const name =
          String(
            wallet?.standardWallet?.name ||
            ""
          ).toLowerCase();


        return (

          client.includes("privy") ||

          connector.includes(
            "embedded"
          ) ||

          name.includes("privy")

        );

      }
    ) ||

    null
  );

}



/*
====================================================
APP
====================================================
*/


function App() {

  const {

    ready,

    authenticated,

    user,

    logout,

    getAccessToken

  } = usePrivy();



  const {

    ready: walletsReady,

    wallets

  } = useWallets();



  const {

    generateSiwsMessage,

    loginWithSiws

  } = useLoginWithSiws();



  const [

    phantomAddress,

    setPhantomAddress

  ] = useState("");



  const [

    busy,

    setBusy

  ] = useState(false);



  const [

    progress,

    setProgress

  ] = useState("");



  const [

    error,

    setError

  ] = useState("");



  const [

    tokenReady,

    setTokenReady

  ] = useState(false);



  /*
  ==================================================
  PRIVY REBOUND WALLET
  ==================================================
  */


  const reboundWallet =
    useMemo(
      () => {

        if (!authenticated) {
          return null;
        }


        return findPrivyWallet(
          wallets
        );

      },

      [
        wallets,
        authenticated
      ]
    );



  /*
  ==================================================
  PHANTOM ADDRESS FROM PRIVY SESSION
  ==================================================
  */


  const linkedPhantom =
    useMemo(
      () => {

        if (
          !user?.linkedAccounts
        ) {

          return null;

        }


        return (

          user.linkedAccounts.find(
            account => {

              const client =
                String(
                  account?.walletClientType ||
                  ""
                ).toLowerCase();


              return (

                account?.type ===
                  "wallet"

                &&

                (
                  client.includes(
                    "phantom"
                  )

                  ||

                  (
                    account?.chainType ===
                      "solana"
                  )

                )

              );

            }
          )

          ||

          null

        );

      },

      [user]
    );



  const displayedPhantomAddress =

    phantomAddress

    ||

    linkedPhantom?.address

    ||

    "";



  /*
  ==================================================
  ACCESS TOKEN TEST
  ==================================================
  */


  useEffect(
    () => {

      let cancelled =
        false;


      async function loadToken() {

        if (
          !ready ||
          !authenticated
        ) {

          if (!cancelled) {

            setTokenReady(false);

          }

          return;

        }


        try {

          const token =
            await getAccessToken();


          if (!cancelled) {

            setTokenReady(
              Boolean(token)
            );

          }

        }

        catch (err) {

          console.error(
            "Access token error:",
            err
          );


          if (!cancelled) {

            setTokenReady(false);

          }

        }

      }


      loadToken();


      return () => {

        cancelled = true;

      };

    },

    [
      ready,
      authenticated,
      getAccessToken
    ]
  );



  /*
  ==================================================
  CONNECT + AUTHENTICATE
  ==================================================
  */


  async function connectPhantom() {

    setError("");

    setBusy(true);

    setProgress(
      "Connecting Phantom…"
    );


    try {

      /*
       * STEP 1
       *
       * Connect directly to Phantom.
       *
       * This mirrors the connection style
       * used successfully by ASTY Unlockr.
       */

      const provider =
        getPhantomProvider();


      if (!provider) {

        throw new Error(
          "Phantom was not detected. On mobile, open ASTY Rebound inside the Phantom browser."
        );

      }



      const connection =
        await provider.connect();



      const address =

        connection?.publicKey
          ?.toString()

        ||

        provider?.publicKey
          ?.toString();



      if (!address) {

        throw new Error(
          "Phantom connected, but no wallet address was returned."
        );

      }



      setPhantomAddress(
        address
      );



      /*
       * STEP 2
       *
       * Privy creates the official
       * Sign-In With Solana message.
       */

      setProgress(
        "Preparing secure login…"
      );


      const message =
        await generateSiwsMessage({

          address

        });



      /*
       * STEP 3
       *
       * Phantom signs the login message.
       *
       * No transaction.
       * No SOL.
       * No token movement.
       */

      setProgress(
        "Confirm the login in Phantom…"
      );


      const encodedMessage =
        new TextEncoder()
          .encode(message);



      const signed =
        await provider.signMessage(

          encodedMessage,

          "utf8"

        );



      if (
        !signed?.signature
      ) {

        throw new Error(
          "Phantom did not return a login signature."
        );

      }



      const signature =
        bytesToBase64(
          signed.signature
        );



      /*
       * STEP 4
       *
       * Privy verifies the signature
       * and creates the login session.
       */

      setProgress(
        "Signing in to ASTY Rebound…"
      );


      await loginWithSiws({

        message,

        signature

      });



      setProgress(
        "Authenticated ✓"
      );


      setBusy(false);

    }

    catch (err) {

      console.error(
        "Phantom login error:",
        err
      );


      setBusy(false);

      setProgress("");


      let message =

        err?.message

        ||

        String(err)

        ||

        "Phantom login failed.";



      if (
        String(message)
          .toLowerCase()
          .includes(
            "user rejected"
          )
      ) {

        message =
          "The Phantom request was cancelled.";

      }



      setError(
        message
      );

    }

  }



  /*
  ==================================================
  LOGOUT
  ==================================================
  */


  async function handleLogout() {

    setError("");

    setBusy(true);


    try {

      await logout();


      setTokenReady(false);

      setPhantomAddress("");

      setProgress("");

      setBusy(false);

    }

    catch (err) {

      console.error(
        err
      );


      setBusy(false);


      setError(
        "Logout failed."
      );

    }

  }



  /*
  ==================================================
  STATUS
  ==================================================
  */


  const loading =

    !ready

    ||

    !walletsReady;



  let statusText =
    "Not connected";


  let dotClass =
    "dot";



  if (loading) {

    statusText =
      "Initializing Rebound…";

  }


  else if (
    authenticated
  ) {

    statusText =
      "Authenticated";

    dotClass =
      "dot ready";

  }


  else if (busy) {

    statusText =
      progress ||
      "Connecting…";

    dotClass =
      "dot connecting";

  }



  /*
  ==================================================
  UI
  ==================================================
  */


  return e(

    "main",

    {
      className:
        "wrap"
    },



    /*
    BRAND
    */


    e(

      "div",

      {
        className:
          "brand"
      },


      e(

        "div",

        {
          className:
            "mark"
        }

      ),


      e(

        "div",

        null,


        e(

          "strong",

          null,

          "ASTY Rebound"

        ),


        e(

          "span",

          null,

          "Automated dip & rebound strategy"

        )

      )

    ),



    /*
    HERO
    */


    e(

      "section",

      {
        className:
          "hero"
      },


      e(

        "h1",

        null,

        "Rebound"

      ),


      e(

        "p",

        {
          className:
            "lead"
        },

        "Connect Phantom to access ASTY Rebound."

      )

    ),



    /*
    CARD
    */


    e(

      "section",

      {
        className:
          "card"
      },



      e(

        "div",

        {
          className:
            "status"
        },


        e(

          "span",

          {
            className:
              dotClass
          }

        ),


        statusText

      ),



      /*
      NOT AUTHENTICATED
      */


      !authenticated

      ?

      e(

        React.Fragment,

        null,



        e(

          "button",

          {

            className:
              "primary",


            disabled:

              loading

              ||

              busy,


            onClick:
              connectPhantom

          },


          busy

            ?

            "Connecting…"

            :

            "Connect Phantom"

        ),



        busy

        ?

        e(

          "div",

          {
            className:
              "info"
          },

          progress

        )

        :

        null

      )



      :



      /*
      AUTHENTICATED
      */


      e(

        React.Fragment,

        null,


        e(

          "div",

          {
            className:
              "grid"
          },



          /*
          PHANTOM
          */


          e(

            "div",

            {
              className:
                "row"
            },


            e(

              "div",

              {
                className:
                  "label"
              },

              "Phantom Wallet"

            ),


            e(

              "div",

              {
                className:
                  "value"
              },

              displayedPhantomAddress

              ||

              "Connected"

            )

          ),



          /*
          REBOUND WALLET
          */


          e(

            "div",

            {
              className:
                "row"
            },


            e(

              "div",

              {
                className:
                  "label"
              },

              "Rebound Wallet"

            ),


            e(

              "div",

              {
                className:

                  reboundWallet?.address

                  ?

                  "value good"

                  :

                  "value waiting"
              },


              reboundWallet?.address

              ||

              "Creating / loading Rebound wallet…"

            )

          ),



          /*
          PRIVY USER
          */


          e(

            "div",

            {
              className:
                "row"
            },


            e(

              "div",

              {
                className:
                  "label"
              },

              "Privy User"

            ),


            e(

              "div",

              {
                className:
                  "value"
              },

              user?.id

              ||

              "—"

            )

          ),



          /*
          ACCESS TOKEN
          */


          e(

            "div",

            {
              className:
                "row"
            },


            e(

              "div",

              {
                className:
                  "label"
              },

              "Login Session"

            ),


            e(

              "div",

              {
                className:

                  tokenReady

                  ?

                  "value good"

                  :

                  "value waiting"
              },


              tokenReady

              ?

              "Ready ✓"

              :

              "Preparing…"

            )

          )

        ),



        /*
        SUCCESS
        */


        reboundWallet?.address

        &&

        tokenReady

        ?

        e(

          "div",

          {
            className:
              "info"
          },

          "ASTY Rebound login successful. Phantom and your Rebound wallet are ready."

        )

        :

        null,



        /*
        LOGOUT
        */


        e(

          "button",

          {

            className:
              "secondary",


            disabled:
              busy,


            onClick:
              handleLogout

          },

          "Log out"

        )

      ),



      /*
      ERROR
      */


      error

      ?

      e(

        "div",

        {
          className:
            "error"
        },

        error

      )

      :

      null,



      /*
      FOOTER INFO
      */


      e(

        "p",

        {
          className:
            "small"
        },

        "Prototype only. ASTY checks, deposits, withdrawals and trading are not active yet."

      )

    )

  );

}



/*
====================================================
PRIVY PROVIDER
====================================================
*/


const connectors =
  toSolanaWalletConnectors(
    {
      shouldAutoConnect:
        false
    }
  );



createRoot(

  document.getElementById(
    "root"
  )

).render(

  e(

    PrivyProvider,

    {

      appId:
        APP_ID,


      config: {



        /*
        SOLANA WALLET LOGIN
        */


        loginMethods: [
          "wallet"
        ],



        appearance: {

          theme:
            "dark",


          walletChainType:
            "solana-only",


          walletList: [
            "phantom"
          ]

        },



        /*
        PRIVY SOLANA SUPPORT
        */


        externalWallets: {

          solana: {

            connectors

          }

        },



        /*
        CREATE REBOUND WALLET
        AFTER LOGIN
        */


        embeddedWallets: {

          solana: {

            createOnLogin:
              "all-users"

          }

        }

      }

    },


    e(App)

  )

);

</script>

</body>

</html>
